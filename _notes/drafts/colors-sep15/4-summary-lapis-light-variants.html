<title>Summary: lapis light-mode variants</title>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:Karla,system-ui,sans-serif;background:#bbb}
  h1{margin:0;padding:14px 20px;font-size:17px;background:#222;color:#eee}
  h1 small{display:block;font-weight:400;color:#aaa;font-size:13px;margin-top:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:2px;background:#888}
  .tile{display:flex;flex-direction:column}
  .tag{padding:10px 14px;font-weight:700;font-size:14px;background:#eee;color:#222}
  .tag small{display:block;font-weight:400;color:#555;margin-top:3px;line-height:1.35}
  .sw{display:flex;gap:4px;margin-top:6px}.sw i{width:18px;height:18px;border-radius:3px;border:1px solid #0003}
  .pane{flex:1;padding:20px 24px;font-family:"Source Serif 4",Georgia,serif;font-size:15px;line-height:1.55;background:var(--bg);color:var(--tx)}
  .L{--bg:#f3f3f3;--tx:#343434;--link:#8a5320}
  .D{--bg:#1c1a17;--tx:#d3cbba;--link:#d9b483}
  .pill{display:table;margin:0 auto 16px;padding:.45em 1.05em;border-radius:999px;font-family:Karla,sans-serif;font-size:.8em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--fill);color:var(--c);border:1px solid var(--line)}
  .pill span{font-weight:400;letter-spacing:0;text-transform:none;margin-left:.8em;padding-left:.8em;border-left:1px solid var(--line);opacity:.8}
  .card{position:relative;padding:1.3em 1.5em;border-radius:4px;background:var(--fill);border:1px solid var(--line);color:var(--ctx,inherit);box-shadow:inset 0 0 0 4px var(--fillsolid,var(--fill)),inset 0 0 0 5px var(--in)}
  .lab{font-family:Karla,sans-serif;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.45em;font-size:.95em;color:var(--c);display:flex;align-items:center;gap:.6em}
  .lab::before{content:"";width:1.4em;height:2px;background:var(--dash)}
  .card p{margin:0}.card a{color:var(--clink,var(--link))}
  .ev{margin:18px 0 0;padding:.6em 1em;border-left:.375em solid;font-size:.9em}
  .L .q{border-color:#a8792a}.D .q{border-color:#d4a04a}
  .L .g{border-color:#2e6b63;background:rgba(46,107,99,.05)}.D .g{border-color:#4fa89c;background:rgba(79,168,156,.08)}
</style>

<h1>Summary card — option 1, new light-mode colours
<small>Dark mode stays as option 1 (reference tile first). No gold dash in the pill. Swatches: fill · border · label · gold inset · dash.</small></h1>
<div class="grid" id="out"></div>
<script>
// [name, note, mode, vars]
const V=[
 ["Dark reference","Option 1 dark, unchanged.","D",{fill:"#1f232b",line:"#3b465a",c:"#9fb6dc",in:"#8f7340",dash:"#d4a04a"}],
 ["A · Current light","Round 3 option 1, for comparison.","L",{fill:"#e9edf3",line:"#b9c4d6",c:"#2d4b7a",in:"#c9a45a",dash:"#a8792a"}],
 ["B · Ultramarine","Clearer, more vivid blue instead of the greyed one.","L",{fill:"#e3eaf8",line:"#9db2de",c:"#22408c",in:"#c29a48",dash:"#a8792a"}],
 ["C · Lapis on vellum","Warm cream fill, blue border and label. Warmth against the grey page.","L",{fill:"#f8f3e8",line:"#a9b9d6",c:"#27478a",in:"#c9a45a",dash:"#a8792a"}],
 ["D · Crisp white, lapis line","Near-white card, a firm lapis border, gold inset.","L",{fill:"#fcfcfd",line:"#2d4b7a",c:"#2d4b7a",in:"#c9a45a",dash:"#a8792a"}],
 ["E · Inverted lapis","Deep lapis card with cream text and a gold label, mirroring dark mode.","L",{fill:"#263c6e",line:"#263c6e",c:"#e6c27a",in:"#c9a45a",dash:"#e6c27a",ctx:"#eef0f6",clink:"#f0d49a"}],
 ["F · Periwinkle","Softer, violet-leaning blue; gentler than ultramarine.","L",{fill:"#e8eafa",line:"#b2b9e6",c:"#394a9e",in:"#c29a48",dash:"#a8792a"}],
 ["G · Gold border, lapis inset","Swaps the roles: gold outer border, lapis inner hairline.","L",{fill:"#ebeff6",line:"#c9a45a",c:"#22408c",in:"#8ea3cc",dash:"#a8792a"}],
 ["H · Lapis wash gradient","Deeper blue at the top fading lighter, like a pigment wash.","L",{fill:"linear-gradient(180deg,#dce5f5,#f0f3f9)",fillsolid:"transparent",line:"#a9b9d6",c:"#1f3f73",in:"#c29a48",dash:"#a8792a",sw:"#dce5f5"}],
];
const keys=["fill","line","c","in","dash"];
const sw=v=>`<div class="sw">${keys.map(k=>{const c=k==="fill"&&v.sw?v.sw:v[k];return `<i style="background:${c}" title="${k}: ${c}"></i>`}).join("")}</div>`;
document.getElementById("out").innerHTML=V.map(([n,s,m,v])=>{
 const st=Object.entries(v).filter(([k])=>k!=="sw").map(([k,x])=>`--${k}:${x}`).join(";");
 return `<div class="tile"><div class="tag">${n}<small>${s}</small>${sw(v)}</div><div class="pane ${m}" style="${st}">
 <div class="pill">Summary<span>Show</span></div>
 <div class="card"><div class="lab">Summary</div><p>The Qur'an presents itself as a book of guidance, and <a href="#">its own claims</a> about preservation are best tested against the manuscript record rather than assumed.</p></div>
 <blockquote class="ev q">A quoted verse sits in a gold-ruled panel.</blockquote>
 <blockquote class="ev g">The author's gloss sits in verdigris.</blockquote></div></div>`}).join("");
</script>
