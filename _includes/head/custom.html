<!-- start custom head snippets -->

<!-- Amiri: designed for Qur'anic typesetting. Loaded so the end-of-ayah marker
     (U+06DD) encloses its digits and the ornate parentheses (U+FD3E/FD3F)
     render correctly, rather than depending on the reader's installed fonts.

     Source Serif 4: site-wide body/heading face, replacing the theme's
     default system-UI sans stack.

     Abril Fatface: masthead site-title only -- a heavier, more dramatic
     display face reserved for the brand mark, distinct from the reading
     type above. Single weight (400 is its only cut; the face is drawn
     heavy by design, not by font-weight).

     Karla: UI text that isn't reading content and isn't the brand mark --
     the masthead nav link and the TOC. A humanist sans that complements
     Source Serif 4 without competing with either the body serif or the
     Abril Fatface title. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Amiri:wght@400;700&family=Karla:wght@400;500;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">

<style>
  /* form controls, scrollbars and the like. assets/css/dark.scss sets the
     dark counterpart. */
  :root {
    color-scheme: light;
  }

  /* WebKit paints a rectangular highlight over the whole tap target on
     touch, which pokes out past round buttons (#floating-nav, TOC toggle)
     as a visible box. Cosmetic only -- does not touch the real :focus-visible
     ring ($focus-color in dark.scss), so keyboard focus stays visible. */
  html {
    -webkit-tap-highlight-color: transparent;
  }

  /* The theme's own compiled CSS sets `a:focus, button:focus { outline: ...
     }` unconditionally -- it is not gated by :focus-visible at all (checked
     the compiled output; there is no :focus-visible anywhere in it). So
     every plain link and button the theme renders, not just the ones this
     repo adds, shows that outline on a mouse click, not only on real
     keyboard navigation -- most noticeably clicking around the sticky TOC
     sidebar's own <a> links. :not(:focus-visible) suppresses it for a
     pointer-triggered focus while leaving it for keyboard use. Two extra
     `:not()`s beat the theme's plain `a:focus`/`button:focus` on
     specificity, so this wins regardless of source order and needs no
     `!important` and no duplicate in dark.scss. */
  a:focus:not(:focus-visible),
  button:focus:not(:focus-visible) {
    outline: none;
  }

  /* Reading type face, replacing the theme's default system-UI sans stack
     for body copy and headings. Deliberately scoped to body + headings, not
     a blanket override: the theme gives nav/masthead/sidebar/buttons/TOC/
     breadcrumbs/pagination/notices/tables their own explicit font-family
     rule (same sans stack), so a `body *` wildcard would also have to fight
     past those, plus Font Awesome's icon classes and the monospace code/
     .quran-arabic rules below -- all of which need to keep their own font.
     Leaving UI chrome in the system sans stack and reserving the serif for
     reading content is also a deliberate, common editorial split, not just
     the easy way out.

     Plain paragraphs, lists, and blockquote text in .page__content have no
     font-family rule of their own in the theme, so they already inherit
     from body without needing to be named here.

     !important for the same cascade-order reason as the other overrides in
     this file: this include renders before main.css, so a plain override of
     equal specificity loses to source order -- and the theme's own
     h1-h6 rule is exactly that: equal specificity, defined later. */
  body,
  h1, h2, h3, h4, h5, h6 {
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif !important;
  }

  /* Masthead brand mark only -- a heavier, more dramatic display face than
     the reading type above, reserved for the one-word site title. .site-title
     has no font-family rule of its own in the theme (it inherits the sans
     stack from its parent .masthead__inner-wrap), so this doesn't need
     !important to win, but carries one anyway for consistency with the
     cascade-order reasoning used throughout this file. font-weight: 400 is
     Abril Fatface's only cut -- the face is drawn heavy, not made heavy by
     weight. */
  .site-title {
    font-family: "Abril Fatface", "Source Serif 4", Georgia, serif !important;
    font-weight: 400 !important;
    letter-spacing: 0.01em;
  }

  /* Masthead nav link ("The Qur'an and the Messenger ﷺ") -- UI text, not
     reading content and not the brand mark, so neither the serif nor the
     display face belongs here. Like .site-title, this has no font-family
     of its own in the theme (inherits sans from .masthead__inner-wrap), so
     !important isn't required to win, but is kept for consistency. */
  .masthead__menu-item a {
    font-family: "Karla", -apple-system, BlinkMacSystemFont, "Roboto",
                 "Segoe UI", Arial, sans-serif !important;
  }

  /* The mode toggle in the masthead, styled to match the theme's adjacent
     .search__toggle (height 2rem, borderless, $primary-color). No end margin,
     so the search toggle's own 1rem is the whole gap between the pair rather
     than 2rem of stacked margins.

     Colours are hardcoded from the dirt skin, like everything else in this
     file; assets/css/dark.scss carries the dark values. */
  #theme-toggle {
    margin-inline-start: 1rem;
    margin-inline-end: 0;
    height: 2rem;
    padding: 0;
    display: flex;
    align-items: center;
    color: #343434;
    background-color: transparent;
    border: 0;
    outline: none;
    cursor: pointer;
    transition: color 0.2s;
  }

  #theme-toggle:hover {
    color: #8e8b82;
  }

  /* This button (and #floating-nav's, in footer/custom.html) is plain HTML
     added by this repo, not part of the theme's compiled CSS -- so it never
     picked up the theme's own :focus-visible-gated ring (built around
     $focus-color in dark.scss) and instead shows the browser's raw UA
     outline on ANY focus, including a mobile tap. :not(:focus-visible)
     keeps that outline for real keyboard navigation and removes it
     everywhere else. */
  #theme-toggle:focus:not(:focus-visible) {
    outline: none;
  }

  /* Which icon shows is "what clicking does", not "what mode this is": the sun
     appears in dark mode because it switches back to light.

     The inline script in this file sets data-theme before the masthead is
     parsed, so there is no frame where both are visible. Without JavaScript
     there is no data-theme and no working toggle, so the button is hidden
     entirely — the theme puts the `js` class on <html> in its own head. */
  #theme-toggle .theme-toggle__sun {
    display: none;
  }

  [data-theme="dark"] #theme-toggle .theme-toggle__sun {
    display: block;
  }

  [data-theme="dark"] #theme-toggle .theme-toggle__moon {
    display: none;
  }

  html:not(.js) #theme-toggle {
    display: none;
  }

  /* Qur'anic Arabic (Uthmani script) shown alongside English translations */
  .quran-arabic {
    font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic",
                 "Traditional Arabic", "Arabic Typesetting", serif;
    font-size: 1.4em;
    line-height: 2.1;
    text-align: right;
    margin: 0.4em 0;
    /* the theme italicises blockquotes; Arabic has no true italic, so the
       browser fakes an oblique slant. Cancel it. */
    font-style: normal;
  }

  /* trailing reference: end-of-ayah marker for whole verses,
     [surah: number] for partial quotations */
  .quran-arabic .ayah-ref {
    font-size: 0.75em;
    opacity: 0.7;
    white-space: nowrap;
  }

  /* Evidence blocks come in three kinds, each with its own rule colour so a
     reader can tell which is which before reading it:

       .quote  - revealed text: Qur'an and hadith
       .src    - a block led by its source reference; recedes
       .gloss  - the author's own commentary; asserts

     Applied in markdown with a kramdown attribute list on the line directly
     after the block ({: .src }), so no inline HTML is involved and MD033 in
     .markdownlint.json does not need widening. A blockquote holding only a
     link, or a prose aside, is left untagged and keeps the theme's default
     dark rule.

     The palette is an illuminated-manuscript one -- gold for the revealed
     text, verdigris for the commentary, and a taupe between them for the
     apparatus -- chosen to sit with the dirt skin's warm accents (#e9dcbe,
     #b4a490, #ca7f32) on its #f3f3f3 background without borrowing the link
     colour. It does not track the skin, so changing minimal_mistakes_skin
     means re-checking these by hand.

     Contrast on #f3f3f3: .src text 5.4:1 (WCAG AA for small text is 4.5:1);
     rules are decorative, and .gloss/.quote text is the theme's #343434 at
     11.2:1. Do not swap the .src colour back to an opacity -- opacity fades
     any link inside the block along with the text. */

  /* minimal-mistakes reserves the right-sidebar gutter by floating .page
     (and .archive) right and narrowing it by $right-sidebar-width(-narrow).
     That only tiles correctly when a left `.sidebar` (author profile) fills
     the space the float leaves behind on its left. author_profile is false
     everywhere on this site, so nothing does, and the content column
     rendered ~200-300px narrower than it needed to be with a blank gutter
     to its left instead of its right. Dropping the float lets the block
     sit flush left and use the full width; the padding-inline-end it
     already carries still reserves room on the right for the TOC, which
     pulls into that padding via its own negative margin. */
  @media (min-width: 64em) {
    /* !important: this include is emitted before the theme's own
       stylesheet link, so a plain override of the same specificity loses
       the cascade to main.css's later rules. */
    .page,
    .archive {
      float: none !important;
      width: 100% !important;
    }
  }

  /* Shrink article body text (not the masthead, nav, or TOC) so more of an
     article fits on screen without scrolling. Em-based: the theme's own
     heading rules (e.g. h1 { font-size: 1.563em }) are already relative to
     this, so headings inside articles shrink proportionally along with
     paragraphs. */
  /* Shrink article body text (not the masthead, nav, or TOC) so more of an
     article fits on screen without scrolling. Em-based: the theme's own
     heading rules (e.g. h1 { font-size: 1.563em }) are already relative to
     this, so headings inside articles shrink proportionally along with
     paragraphs. */
  .page__content {
    font-size: 0.85em;
  }

  /* The TOC widget (nav.toc, both the desktop sticky sidebar and the
     mobile inline version) renders inside .page__content, so without this
     it inherits the reduction above and reads smaller than the rest of
     the site's navigation. rem, not em, so it's sized off the root and
     doesn't restack with the ancestor's reduced font-size. */
  .page__content .toc {
    font-size: 1rem;
  }

  /* TOC entries are UI navigation, not reading content, so they get the
     same Karla treatment as the masthead nav link rather than the serif
     reading face. .toc already has its own explicit sans-family rule in
     the theme (equal specificity, defined later in main.css), hence
     !important -- same cascade-order reason as elsewhere in this file.

     #toc-panel is footer/custom.html's mobile floating-drawer clone of this
     same widget, mounted outside .page__content -- without naming it here
     too, the drawer would keep the theme's default sans while the desktop/
     inline TOC switched to Karla. */
  .page__content .toc,
  #toc-panel .toc {
    font-family: "Karla", -apple-system, BlinkMacSystemFont, "Roboto",
                 "Segoe UI", Arial, sans-serif !important;
  }

  /* Same problem as the font-size exemption above: the list-indent and
     heading-margin density rules further down also match .toc's own <ul>
     and its <h4> "On this page" title, adding an unwanted left indent and
     a gap above the title. Both new selectors carry more classes than the
     rules they're correcting, so specificity -- not source order -- is
     what makes them win regardless of where they sit in the cascade.

     The title's spacing is 0.5rem 0.75rem of *padding* (.nav__title's own
     margin is already zero), so the fix is to zero the heading-margin
     rule's contribution outright, not to reintroduce 0.5rem as a margin --
     that would stack a second 0.5rem on top of the padding already doing
     the job. */
  .page__content .toc ul,
  .page__content .toc ol {
    padding-inline-start: 0 !important;
  }

  .page__content .toc .nav__title {
    margin-top: 0 !important;
  }

  /* "On this page" is UI chrome, like the rest of .toc, even though it
     happens to render as an <h4>. Without this, the h1-h6 rule above pulls
     just this title into the serif face while its sibling entries stay
     Karla -- an inconsistency within one widget. Matches .toc's own font
     above; more specific selector, so it wins regardless of the shared
     !important. Also covers #toc-panel's clone, for the same reason as
     the .toc rule above -- kept separate from the margin-top fix since
     that one is inline-TOC-specific and this one isn't. */
  .page__content .toc .nav__title,
  #toc-panel .nav__title {
    font-family: "Karla", -apple-system, BlinkMacSystemFont, "Roboto",
                 "Segoe UI", Arial, sans-serif !important;
  }

  /* .page__content a:not(.btn):hover underlines every link inside an
     article, and the TOC lives in .page__content (see above), so its
     links picked up the underline too -- appropriate for prose links,
     not for navigation. One more class than the theme rule so it wins
     on specificity, matching the pattern above. */
  .page__content .toc .toc__menu a:hover {
    text-decoration: none;
  }

  /* The theme's own "On this page" title icon (fa-bars) reads as a second,
     redundant hamburger next to #toc-toggle's. Hiding it is display: none,
     not visibility, so #toc-panel .nav__title's flex `gap` (added to fill
     the whitespace the icon used to occupy) collapses to zero along with
     it -- gap only spaces *visible* flex children. */
  .page__content .toc .nav__title i,
  #toc-panel .nav__title i {
    display: none;
  }

  /* Nested subsection links inherit the theme's `.toc .active a` rule
     wherever they are descendants of the currently active <li> -- e.g. an
     h2's h3 children while the h2 itself is active -- because that rule is
     a plain descendant selector with no depth limit. That paints a partial,
     text-width highlight under links that are not actually the active one.
     Reset just the nested case; the active row's own link is untouched
     since it never sits inside a `ul` of its own li. Type-selector count
     (ul + a) beats the theme's rule regardless of source order. */
  .toc .active ul a {
    background-color: transparent;
    color: #8e8b82;
  }

  /* Font-size alone barely moves content-per-screen, since line-height and
     the em-based margins on headings/blockquotes ride along with it
     proportionally rather than compounding. Tightening them independently
     (moderate cut, ~10-15%) is what actually buys more article per
     viewport. !important for the same cascade-order reason as above;
     specificity would otherwise tie with the theme's own .page__content
     rules and lose to source order. */
  .page__content {
    line-height: 1.4 !important;
  }

  .page__content h1,
  .page__content h2,
  .page__content h3,
  .page__content h4,
  .page__content h5,
  .page__content h6 {
    margin-top: 1.3em !important;
  }

  .page__content blockquote {
    margin-block: 1.3em !important;
  }

  /* Lists and blockquotes were carrying the browser's UA default indents
     (ul/ol padding-inline-start: 40px; blockquote margin-inline-start:
     40px, which the theme's own blockquote rule below never touched).
     On a bullet-led site that's a lot of reclaimable line width -- a
     narrower line wraps to more lines, which costs far more vertical
     space than the indent bought in scannability. Quotes nested inside a
     bullet were paying both indents at once (list padding + blockquote
     margin + blockquote padding), so this matters most there. */
  .page__content ul,
  .page__content ol {
    padding-inline-start: 1.25em !important;
  }

  .page__content blockquote {
    margin-inline: 0 !important;
    padding-inline: 0.75em !important;
  }

  /* generally smaller than body text, matching the existing .src
     convention below rather than inventing a second scale */
  .page__content blockquote {
    font-size: 0.9em !important;
  }

  /* revealed text: gold */
  blockquote.quote {
    border-inline-start-color: #a8792a;
  }

  /* apparatus: taupe rule, sepia text, a shade smaller. Recedes. */
  blockquote.src {
    /* the theme italicises blockquotes; a citation is not a quotation */
    font-style: normal;
    font-size: 0.9em;
    color: #6f6152;
    border-inline-start-color: #a1937c;
  }

  /* the author's own voice: verdigris rule and the faintest wash, so
     commentary reads as a panel rather than as more of the source */
  blockquote.gloss {
    font-style: normal;
    border-inline-start-width: 0.375em;
    border-inline-start-color: #2e6b63;
    background-color: rgba(46, 107, 99, 0.05);
    padding-block: 0.6em;
  }

  /* The panel's own padding-block already sets the gap above and below the
     text; without this, the <p>'s UA margin (~0.75em) stacks on top of it
     on both ends, doubling the gap and reading as leftover empty space
     inside the coloured panel. */
  blockquote.gloss > p:first-child {
    margin-top: 0;
  }

  blockquote.gloss > p:last-child {
    margin-bottom: 0;
  }

  /* Collapsible YouTube reference (_includes/yt-embed.html). Same taupe/
     sepia palette as .src above, since a linked video is the same kind of
     apparatus as a source citation -- it recedes rather than asserting.
     <details>/<summary> gives closed-by-default and keyboard toggling for
     free, so there is no open/close JS to write. Dark counterpart in
     assets/css/dark.scss. */
  .yt-embed {
    margin: 0.6em 0;
    border-inline-start: 0.1875em solid #a1937c;
    padding-inline-start: 0.75em;
  }

  .yt-embed > summary {
    cursor: pointer;
    color: #6f6152;
    font-size: 0.9em;
    padding-block: 0.3em;
    list-style: none;
  }

  .yt-embed > summary::-webkit-details-marker {
    display: none;
  }

  .yt-embed > summary::before {
    content: "\25b8";
    display: inline-block;
    width: 1em;
    transition: transform 0.2s ease;
  }

  .yt-embed[open] > summary::before {
    transform: rotate(90deg);
  }

  .yt-embed__note {
    opacity: 0.75;
  }

  /* Holds the no-JS fallback link until the script in footer/custom.html
     swaps a player in, so this is in normal flow by default -- collapsing
     it to the 16:9 box below while it contains only a link would leave a
     lone link floating in a viewport-wide empty rectangle. */
  .yt-embed__frame {
    margin-block: 0.5em;
  }

  /* An opened box between the browser showing it and the script filling it
     -- see the `yt-embed-js` note in footer/custom.html. Collapsed to
     nothing, margins included, so it hands over to the growth animation's
     first frame at exactly the same height and the page never twitches.
     Gated on the class, so a reader without JS keeps the plain link that
     is all they have. */
  .yt-embed-js .yt-embed[open] .yt-embed__frame:not(.is-loaded) {
    height: 0;
    margin-block: 0;
    padding-bottom: 0;
    overflow: hidden;
  }

  /* 16:9 responsive frame -- the classic padding-bottom hack, since aspect-
     ratio support is not needed anywhere else on the site yet. Gated on the
     class rather than `:has(iframe)` so the rule lands in the same tick as
     the injected element, with no dependence on :has support.

     The growth is animated because the box's contents are built on open
     rather than shipped with the page: without this it snaps from a
     one-line link to a viewport-wide 16:9 rectangle in a single frame,
     throwing everything below it down the page. Animating padding-bottom
     (not height, which is pinned at 0 by the hack above) is what actually
     moves layout -- an opacity fade alone would leave the jump untouched.

     Doing it as an animation rather than a transition is deliberate: the
     class lands in the same tick as the injected poster, so a transition
     would have no earlier value to start from and would need a JS
     requestAnimationFrame dance in footer/custom.html. `both` holds the
     final frame, and the declared padding-bottom below is the same value,
     so the box is correct with or without animation support.

     The background is the poster's own near-black rather than a tint of
     the page, so that any sliver visible around the poster -- or behind
     the player once the poster has gone -- is dark. Dark in both skins by
     construction, so assets/css/dark.scss carries no counterpart. */
  .yt-embed__frame.is-loaded {
    position: relative;
    height: 0;
    padding-bottom: 56.25%;
    overflow: hidden;
    background-color: #1e1b18;
    animation: yt-embed-open 0.28s ease-out both;
  }

  /* Margins ride along with the padding. They are only 0.5em each, but a
     box that grows smoothly from a standing start of 1em still starts with
     a visible step, and in a swap the step is only invisible because the
     other box happens to take it at the same moment. */
  @keyframes yt-embed-open {
    from {
      margin-block: 0;
      padding-bottom: 0;
    }
    to {
      margin-block: 0.5em;
      padding-bottom: 56.25%;
    }
  }

  /* The mirror of the open, and deliberately not `reverse` of it: the two
     have to cancel out. When one box is swapped for another, this shrink
     and that growth run at the same time, and the page only holds still if
     what one loses the other gains at every instant -- which needs the
     same duration and the same easing read the same way round, from a
     `from` of 56.25% rather than a reversed curve.

     The close cannot be done in CSS alone. <details> drops its content the
     instant `open` clears, leaving nothing to animate, so the script in
     footer/custom.html intercepts the click, adds this class, and only
     then lets the box close. */
  .yt-embed__frame.is-loaded.is-closing {
    animation: yt-embed-close 0.28s ease-out both;
  }

  @keyframes yt-embed-close {
    from {
      margin-block: 0.5em;
      padding-bottom: 56.25%;
    }
    to {
      margin-block: 0;
      padding-bottom: 0;
    }
  }

  .yt-embed__frame.is-loaded > a {
    display: none;
  }

  /* The fade is what softens the player's arrival while it is mounted on
     open: it comes up out of the frame's near-black rather than slapping
     a white document over it. It cannot hide that load -- only the poster
     below does that -- but it takes the edge off. Invisible, and harmless,
     when USE_POSTER puts an opaque panel on top of it. */
  .yt-embed__frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    animation: yt-embed-fade 0.4s ease-out both;
  }

  /* The poster: a stand-in for the player, shown when a box opens. Opening
     used to mount the real player, and what a reader saw was YouTube's own
     document painting -- white, then the black stage, then the video. That
     is inside a cross-origin frame: no CSS or JS here can style it, and no
     event says when it has painted. The only fix is not to have a player
     there yet.

     Its own background is the near-black the frame carries, so the box is
     dark from the first frame and the thumbnail arriving later cannot
     flash. Everything but the thumbnail is drawn here, which is also the
     fallback: block i.ytimg.com and what remains is a dark panel with a
     title and a play control, still perfectly usable.

     Sits above the iframe (which the click handler inserts underneath) and
     covers it while YouTube loads. */
  .yt-embed__poster {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    background-color: #1e1b18;
    cursor: pointer;
  }

  .yt-embed__poster-img {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    /* cover, because the hqdefault fallback is 4:3 with letterbox bars
       baked into the image -- contain would show them, cover crops them
       off. maxresdefault is already 16:9 and is unaffected. */
    object-fit: cover;
    animation: yt-embed-fade 0.3s ease-out both;
  }

  @keyframes yt-embed-fade {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  /* Scrim: thumbnails are chosen to be eye-catching and many are bright,
     which leaves the play control and title fighting the image. */
  .yt-embed__poster::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background-color: rgba(0, 0, 0, 0.28);
  }

  .yt-embed__poster-title {
    position: absolute;
    z-index: 2;
    top: 0;
    left: 0;
    right: 0;
    padding: 0.55em 0.8em 1.4em;
    background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0));
    color: #f2ece1;
    font-size: 0.85em;
    line-height: 1.3;
    text-align: left;
  }

  /* The disc is not decoration. A bare triangle has to survive whatever
     the thumbnail happens to be, and these are gold-heavy Islamic art --
     a gold mark on gold calligraphy disappears. The disc gives it a
     constant dark ground, so contrast no longer depends on the image. */
  .yt-embed__poster-play {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 3.4em;
    height: 3.4em;
    border: 1px solid rgba(242, 236, 225, 0.3);
    border-radius: 50%;
    background-color: rgba(22, 19, 16, 0.72);
    transition: transform 0.15s ease, background-color 0.15s ease;
  }

  /* A lighter tint of the skin's gold. NOT the #a8792a of blockquote.quote
     -- that gold means "revealed text" and should not leak onto a control;
     this is the same hue lifted for contrast on a near-black ground. */
  .yt-embed__poster-play::before {
    content: "";
    display: block;
    width: 0;
    height: 0;
    /* nudged right by a third of the triangle's width: a triangle centred
       on its bounding box reads as sitting left of centre in a circle. */
    margin-left: 0.4em;
    border-style: solid;
    border-width: 0.7em 0 0.7em 1.15em;
    border-color: transparent transparent transparent #c9973a;
  }

  .yt-embed__poster:hover .yt-embed__poster-play,
  .yt-embed__poster:focus-visible .yt-embed__poster-play {
    transform: scale(1.1);
    background-color: rgba(22, 19, 16, 0.85);
  }

  /* Fades out over the loading player rather than being torn out from in
     front of it. The delay is deliberately generous: too short and a slow
     connection crossfades into the very white this exists to hide, while
     too long costs nothing a reader would notice. `both` holds it
     transparent, and pointer-events go with the paint so the faded poster
     cannot swallow clicks meant for the player. */
  .yt-embed__poster.is-dismissed {
    pointer-events: none;
    animation: yt-embed-poster-out 0.45s ease-in 0.7s both;
  }

  @keyframes yt-embed-poster-out {
    from {
      opacity: 1;
    }
    to {
      opacity: 0;
    }
  }

  /* The animations are pure decoration -- the fill state is what the plain
     rules already declare, so switching them off changes nothing but the
     motion. The poster must still end up transparent, or a reader with
     reduced motion gets a panel stuck over a playing video. */
  @media (prefers-reduced-motion: reduce) {
    .yt-embed__frame.is-loaded,
    .yt-embed__frame.is-loaded.is-closing,
    .yt-embed__frame iframe,
    .yt-embed__poster-img,
    .yt-embed__poster-play {
      animation: none;
      transition: none;
    }

    .yt-embed__poster.is-dismissed {
      animation: none;
      opacity: 0;
    }
  }

  /* Scoped to paragraphs and list items, not the whole .page__content block
     -- justifying short blockquote citations (.src) produces visibly ragged
     word-spacing on a couple of lines, and .quran-arabic already sets its
     own text-align: right. hyphens: auto keeps the narrow phone column from
     opening large rivers between words.

     :not(.toc *) excludes the TOC -- both the sticky/inline copy, which
     lives inside .page__content (see the font-size rule above), and the
     mobile drawer clone, which doesn't but is harmless to exclude too.
     Justifying nav entries reads as broken, not as prose. */
  .page__content p:not(.toc *),
  .page__content li:not(.toc *) {
    text-align: justify;
    -webkit-hyphens: auto;
    hyphens: auto;
  }

  /* Quiet bordered button: the end-of-article link back to quran.md on its
     sub-pages (back-to-quran.html), and the forward link from quran.md to
     messenger.md. Lives here rather than in footer/custom.html's
     page.quran_section conditional block, because quran.md itself has no
     quran_section front matter -- that gate only fires on the sub-pages. */
  .quran-return {
    margin-block: 1.75em;
    text-align: center;
  }

  .quran-return a {
    display: inline-flex;
    align-items: center;
    gap: 0.5em;
    padding: 0.6em 1.2em;
    border: 1px solid #a1937c;
    border-radius: 0.35em;
    color: #6f6152;
    font-family: "Karla", -apple-system, BlinkMacSystemFont, "Roboto",
                 "Segoe UI", Arial, sans-serif;
    font-size: 0.85em;
    text-decoration: none;
    transition: background-color 0.15s ease, border-color 0.15s ease,
                color 0.15s ease;
  }

  .page__content .quran-return a:hover {
    background-color: rgba(161, 147, 124, 0.14);
    border-color: #6f6152;
    color: #343434;
    text-decoration: none;
  }

  .quran-return__arrow {
    font-size: 1.1em;
    line-height: 1;
  }

  /* Citations are hand-authored markdown links styled to look like kramdown's
     old footnote markers (`.footnote` is the theme's own class, so light and
     dark colors come for free from dark.scss recompiling the whole theme --
     see _pages citation markup). vertical-align/font-size aren't colors, so
     no dark counterpart is needed for these two rules. */
  a.footnote {
    vertical-align: super;
    font-size: 0.75em;
  }

  /* Citations are sometimes stacked (e.g. a hadith cited alongside its
     commentary and a secondary source) as adjacent links with nothing
     between them, so "42" and "12" would read as the single number "4212"
     without a small gap. */
  a.footnote + a.footnote {
    margin-inline-start: 0.2em;
  }
</style>

<!-- Dark mode.

     assets/css/dark.scss compiles the whole theme a second time with a dark
     palette; this link switches it on and off. It has to stay the *last*
     stylesheet in the document head: dark.css and main.css are generated from
     the same partials, so every selector matches exactly and source order is
     what decides the winner. That includes the custom CSS above — the dark
     halves of those rules live in dark.scss.

     The media attribute ships as the system query, so a reader with JavaScript
     disabled still gets dark on a dark-preferring system. The script below then
     pins it to `all` / `not all` once there is an explicit choice, and because
     it runs here in <head> the page never paints in the wrong mode. -->
<link id="theme-dark-css" rel="stylesheet" media="(prefers-color-scheme: dark)"
      href="{{ '/assets/css/dark.css' | relative_url }}">

<script>
  (function () {
    var KEY = "theme";
    var SYSTEM_MEDIA = "(prefers-color-scheme: dark)";

    var link = document.getElementById("theme-dark-css");
    var system = window.matchMedia(SYSTEM_MEDIA);

    // null means "follow the system"; localStorage throws in some privacy modes
    var stored = null;
    try {
      stored = window.localStorage.getItem(KEY);
    } catch (e) {}
    if (stored !== "light" && stored !== "dark") stored = null;

    function systemMode() {
      return system.matches ? "dark" : "light";
    }

    function resolved() {
      return stored || systemMode();
    }

    function apply() {
      // with no explicit choice, leave the media query in place and let the
      // stylesheet keep tracking the system by itself
      link.media = stored === null ? SYSTEM_MEDIA
                 : stored === "dark" ? "all"
                 : "not all";

      var mode = resolved();
      document.documentElement.setAttribute("data-theme", mode);

      // not present yet on the first call — this runs before the masthead
      var btn = document.getElementById("theme-toggle");
      if (btn) {
        var label = "Switch to " + (mode === "dark" ? "light" : "dark") + " mode";
        btn.setAttribute("aria-label", label);
        btn.setAttribute("title", label);
      }
    }

    apply();

    function toggle() {
      var next = resolved() === "dark" ? "light" : "dark";
      // picking the mode the system already prefers means going back to
      // following it, rather than pinning the same value forever
      stored = next === systemMode() ? null : next;

      try {
        if (stored === null) window.localStorage.removeItem(KEY);
        else window.localStorage.setItem(KEY, stored);
      } catch (e) {}

      apply();
    }

    function ready() {
      var btn = document.getElementById("theme-toggle");
      if (btn) btn.addEventListener("click", toggle);
      apply();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", ready);
    } else {
      ready();
    }

    // only matters while following the system, but apply() is cheap
    if (system.addEventListener) {
      system.addEventListener("change", apply);
    } else if (system.addListener) {
      system.addListener(apply); // Safari < 14
    }
  })();
</script>
