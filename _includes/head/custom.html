<!-- Amiri: designed for Qur'anic typesetting. Loaded so the end-of-ayah marker
     (U+06DD) encloses its digits and the ornate parentheses (U+FD3E/FD3F)
     render correctly, rather than depending on the reader's installed fonts.

     Source Serif 4: site-wide body/heading face, replacing the theme's
     default system-UI sans stack.

     Abril Fatface: masthead site-title only -- a heavier, more dramatic
     display face reserved for the brand mark, distinct from the reading
     type above. Single weight (400 is its only cut; the face is drawn
     heavy by design, not by font-weight).

     Karla: UI text that isn't reading content and isn't the brand mark --
     the masthead nav link and the TOC. A humanist sans that complements
     Source Serif 4 without competing with either the body serif or the
     Abril Fatface title. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Amiri:wght@400;700&family=Karla:wght@400;500;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">

<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">

<!-- Dark mode.

     The palette lives entirely in custom properties -- see the three
     :root blocks in _sass/minimal-mistakes/skins/_dirt.scss (light,
     explicit-dark via [data-theme="dark"], and the no-JS/no-choice system
     fallback via prefers-color-scheme). `data-theme` on <html> is the single
     source of truth for which one is in effect; a change to it is a defined
     style-change event the browser resolves synchronously, unlike the old
     second-stylesheet-activated-by-media-attribute design this replaced (see
     _notes/guides/theme_internals.md for that history) -- which is what lets
     everything below be this short. The script runs here in <head>, before
     the masthead is parsed, so the page never paints in the wrong mode. -->
<script>
  (function () {
    var KEY = "theme";
    var system = window.matchMedia("(prefers-color-scheme: dark)");

    // null means "follow the system"; localStorage throws in some privacy modes
    var stored = null;
    try {
      stored = window.localStorage.getItem(KEY);
    } catch (e) {}
    if (stored !== "light" && stored !== "dark") stored = null;

    function systemMode() {
      return system.matches ? "dark" : "light";
    }

    function resolved() {
      return stored || systemMode();
    }

    function apply() {
      var root = document.documentElement;
      var mode = resolved();
      root.setAttribute("data-theme", mode);

      /* none present yet on the first call — this runs before the masthead.
         There are two copies of this control (masthead and #floating-nav), so
         every query here is querySelectorAll over the class, not
         getElementById: label and title have to stay in sync on both, or
         scrolling back up reveals a masthead button describing the old
         state. */
      var label = "Switch to " + (mode === "dark" ? "light" : "dark") + " mode";
      var btns = document.querySelectorAll(".theme-toggle");
      for (var i = 0; i < btns.length; i++) {
        btns[i].setAttribute("aria-label", label);
        btns[i].setAttribute("title", label);
      }
    }

    apply();

    function toggle() {
      var next = resolved() === "dark" ? "light" : "dark";
      // picking the mode the system already prefers means going back to
      // following it, rather than pinning the same value forever
      stored = next === systemMode() ? null : next;

      try {
        if (stored === null) window.localStorage.removeItem(KEY);
        else window.localStorage.setItem(KEY, stored);
      } catch (e) {}

      /* Swap the palette under a full-page cross-fade rather than letting
         every element's color property change land silently. The API
         snapshots the viewport, suppresses rendering while the callback
         mutates the DOM, then cross-fades the old snapshot into the new
         one -- and the callback here is synchronous, since a data-theme
         change (unlike the old media-attribute stylesheet swap) resolves
         within the same task, with nothing to wait on.

         That also avoids the tearing a plain synchronous mutation would
         show on its own: changing dozens of custom properties on :root
         invalidates the style of every element on a 12,000px article in one
         go, and without a view transition the browser would spread that
         recalc's paint across several frames -- the masthead's icons and
         colours arriving a frame or two apart reads as the row of buttons
         juddering sideways, even though nothing actually moved. Under a
         view transition those frames happen behind a frozen snapshot, so
         none of them is seen.

         Deliberately root-only -- see the ::view-transition rules in the
         <style> above. `html.theme-swap` there suppresses the one CSS
         transition still on `a`/`.btn`/form controls for the instant of
         this callback, so it can't run its own animation on top of the
         snapshot cross-fade -- see there for why. */
      if (!canCrossFade()) {
        apply();
        return;
      }

      var root = document.documentElement;
      document.startViewTransition(function () {
        root.classList.add("theme-swap");
        apply();
        root.offsetHeight; // force the new colors to land before un-suppressing
        root.classList.remove("theme-swap");
      });
    }

    /* Two ways to end up on the plain, instant path instead, both leaving
       exactly the behaviour this had before cross-fading existed:

       - no View Transitions API. Baseline since October 2025 (Chrome 111,
         Safari 18, Firefox 144), so this is the older-browser tail.
       - the reader asked for less motion. A whole-page cross-fade is
         squarely what that preference is about, and skipping it loses
         nothing: the snapshot still commits the swap in one frame. */
    function canCrossFade() {
      if (!document.startViewTransition) return false;
      return !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function ready() {
      var btns = document.querySelectorAll(".theme-toggle");
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener("click", toggle);
      }
      apply();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", ready);
    } else {
      ready();
    }

    // only matters while following the system, but apply() is cheap
    if (system.addEventListener) {
      system.addEventListener("change", apply);
    } else if (system.addListener) {
      system.addListener(apply); // Safari < 14
    }
  })();
</script>

<!-- Article text-size toggle.

     Same shape as the dark-mode script above, deliberately: an explicit
     choice lives in localStorage under its own key, is mirrored onto
     documentElement as [data-font-size="large"] (which the CSS in this file
     reads), and the button's aria-pressed/label are kept in sync.

     Unlike dark mode's light/dark split, there IS a "follow the system"
     state to fall back to here too -- it just isn't prefers-color-scheme.
     With no explicit choice stored, the default follows viewport width:
     large on phone, normal on desktop, split at the same 64em breakpoint
     the rest of the site already treats as the mobile/desktop line (see
     isSidebarLayout in footer/custom.html and the TOC media query above).
     Reasoning is the mirror image of prose readability on a small screen:
     the shrink in this file's .page__content rule was chosen to fit more
     of an article per desktop viewport, which is the opposite problem on
     a phone, where there is little screen to fit more onto and small type
     is the harder read. Picking the size the viewport already defaults to
     clears the stored value, exactly like the theme toggle. -->
<script>
  (function () {
    var KEY = "fontSize";
    var MOBILE_MEDIA = "(max-width: 63.9375em)";

    var mobile = window.matchMedia(MOBILE_MEDIA);

    var stored = null;
    try {
      stored = window.localStorage.getItem(KEY);
    } catch (e) {}
    if (stored !== "large" && stored !== "normal") stored = null;

    function systemDefault() {
      return mobile.matches ? "large" : "normal";
    }

    function resolved() {
      return stored || systemDefault();
    }

    function apply() {
      /* CSS owns the default in both directions now (see .page__content in
         the <style> above) -- [data-font-size] only needs to be written at
         all when there's an explicit choice to express; with none, removing
         the attribute lets the stylesheet's own viewport-width default show
         through undisturbed. */
      if (stored === null) {
        document.documentElement.removeAttribute("data-font-size");
      } else {
        document.documentElement.setAttribute("data-font-size", stored);
      }

      /* none present yet on the first call -- this runs before the masthead.
         Two copies again (masthead and #floating-nav); see the theme script
         above for why this is a class query rather than an ID lookup. */
      var large = resolved() === "large";
      var label = "Switch to " + (large ? "normal" : "larger") + " text size";
      var btns = document.querySelectorAll(".font-size-toggle");
      for (var i = 0; i < btns.length; i++) {
        btns[i].setAttribute("aria-pressed", large ? "true" : "false");
        btns[i].setAttribute("aria-label", label);
        btns[i].setAttribute("title", label);
      }
    }

    apply();

    function toggle() {
      var next = resolved() === "large" ? "normal" : "large";
      // picking the size the viewport already defaults to means going back
      // to following it, rather than pinning the same value forever
      stored = next === systemDefault() ? null : next;

      try {
        if (stored === null) window.localStorage.removeItem(KEY);
        else window.localStorage.setItem(KEY, stored);
      } catch (e) {}

      apply();
    }

    function ready() {
      var btns = document.querySelectorAll(".font-size-toggle");
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener("click", toggle);
      }
      apply();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", ready);
    } else {
      ready();
    }

    // only matters while following the viewport default, but apply() is cheap
    if (mobile.addEventListener) {
      mobile.addEventListener("change", apply);
    } else if (mobile.addListener) {
      mobile.addListener(apply); // Safari < 14
    }
  })();
</script>
