{% if page.quran_section %}
<!-- The breadcrumb trail itself (quran.md / section on quran.md / this
     page) is now server-rendered in Liquid -- see
     _includes/quran-breadcrumb.html and the theme-include override in
     _includes/breadcrumbs.html. It used to be built here at runtime with
     document.createElement, out of values serialised via `| jsonify`,
     specifically to keep it out of .page__content, which Lunr indexes
     verbatim (search_full_content in CLAUDE.md) -- a static link there
     would become the truncated snippet shown for every search hit on the
     page. That reasoning stopped applying once `search: false` landed in
     _config.yml (no Lunr index exists at all right now), and even with
     search back on, rendering outside .page__content -- which the Liquid
     version already does, by construction -- was always the right fix
     rather than staying in JS.

     Only the return link below (a.back-to-quran-link) is left in this
     script: unlike the breadcrumb, its target genuinely depends on
     document.referrer, a fact only the browser has. -->
<script>
  (function () {
    // return link near the end of the article: only claims "back to where
    // you were" when the referrer really was /quran -- a fact only the
    // browser has, so this stays client-side (see the comment above)
    var quranSection = {{ page.quran_section | jsonify }};
    var returnHref = "/quran";
    try {
      if (document.referrer) {
        var ref = new URL(document.referrer);
        if (ref.origin === window.location.origin &&
            ref.pathname.replace(/\/+$/, "") === "/quran") {
          returnHref = "/quran#" + quranSection;
        }
      }
    } catch (e) {}

    var returnLink = document.querySelector("a.back-to-quran-link");
    if (returnLink) returnLink.href = returnHref;
  })();
</script>
{% endif %}

<!-- Floating navigation for narrow viewports. At $large and up the theme's
     sticky TOC sidebar sits alongside the text, so none of this is needed and
     all of it is hidden. Below that the TOC collapses to an inline block at
     the top of the article and scrolling is the only way back to it.

     The panel is built from a *clone* of the theme's TOC. Repositioning the
     real `.sidebar__right` looks tidier but cannot work: going `position:
     fixed` pulls that node out of the document flow, and it is a tall block
     near the top of the article, so everything below it jumps up by its full
     height. To a reader scrolled halfway down, the page lurches to a
     different section the moment the drawer opens.

     Cloning also keeps the panel a direct child of <body>. That used to
     matter for a second reason too -- the theme's `animation: intro` on
     #main creates a stacking context, and from inside it no z-index could
     lift the panel above a body-level backdrop. #toc-panel is a <dialog>
     now (see site.js), rendered in the top layer regardless of any
     ancestor's stacking context, so that half no longer applies. The first
     reason still does: repositioning the real `.sidebar__right` with
     `position: fixed` would pull a tall block near the top of the article
     out of the document flow, and everything below it would jump up by its
     full height the moment the drawer opened. Cloning is what keeps that
     from happening regardless of how the panel itself is rendered.

     The theme's `.toc` / `.toc__menu` rules are unscoped, so the clone picks
     up the styling for free. What it does not inherit is the scrollspy
     `.active` highlight, which is bound to the original node. -->

<div id="floating-nav">
  <!-- Appearance pair, plus back-to-top: two columns of three, laid out by
       grid-auto-flow: column below -- text size/theme/back-to-top on the
       left, prev/next/TOC on the right. Appearance controls are the same
       two as the masthead, which has scrolled away by the time #floating-nav
       appears. Distinct IDs, shared classes: the scripts in head/custom.html
       bind and sync by class (see there), while the ID-scoped CSS keeps the
       masthead copies' transparent styling off these, which sit on a dark
       translucent disc instead.

       Icons are copied from _includes/masthead.html at 20x20 to match the
       navigation buttons below rather than the 26x26 used in the masthead;
       the sun's deliberately-scaled geometry is preserved as-is. -->
  <button id="floating-font-size-toggle" class="font-size-toggle" type="button" aria-pressed="false" aria-label="Switch to larger text size" title="Switch to larger text size">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <text x="1" y="16" font-size="11" font-family="Georgia, 'Times New Roman', serif" fill="currentColor">A</text>
      <text x="10" y="19" font-size="17" font-family="Georgia, 'Times New Roman', serif" fill="currentColor">A</text>
    </svg>
  </button>
  <button id="floating-theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg class="theme-toggle__moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"
            fill="currentColor" />
    </svg>
    <svg class="theme-toggle__sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="3.4" fill="currentColor" />
      <path d="M12 3.8v2.1 M12 18.1v2.1 M3.8 12h2.1 M18.1 12h2.1 M6.2 6.2l1.5 1.5 M16.3 16.3l1.5 1.5 M17.8 6.2l-1.5 1.5 M7.7 16.3l-1.5 1.5"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
  <button id="back-to-top" type="button" aria-label="Back to top" title="Back to top">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M12 5.5 L5 12.5 M12 5.5 L19 12.5 M12 5.5 L12 19"
            fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <!-- Bare chevrons, no stem -- deliberately distinct from #back-to-top's
       full arrow-with-stem above, since both point roughly the same
       direction and would otherwise be hard to tell apart at a glance. -->
  <button id="prev-section" type="button" aria-label="Previous section" title="Previous section">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M5 14 L12 7 L19 14" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <button id="next-section" type="button" aria-label="Next section" title="Next section">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M5 10 L12 17 L19 10" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <button id="toc-toggle" type="button" aria-expanded="false" aria-label="Table of contents" title="Table of contents">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M4 6.5h16 M4 12h16 M4 17.5h16" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" />
    </svg>
  </button>
</div>

<!-- #toc-panel (built in site.js) is a <dialog>; its ::backdrop is
     generated by the browser on showModal(), styled in site.scss. No
     separate backdrop element needed here any more. -->
