<!-- start custom footer snippets -->

<!-- Floating navigation for narrow viewports. At $large and up the theme's
     sticky TOC sidebar sits alongside the text, so none of this is needed and
     all of it is hidden. Below that the TOC collapses to an inline block at
     the top of the article and scrolling is the only way back to it.

     The panel is built from a *clone* of the theme's TOC. Repositioning the
     real `.sidebar__right` looks tidier but cannot work: going `position:
     fixed` pulls that node out of the document flow, and it is a tall block
     near the top of the article, so everything below it jumps up by its full
     height. To a reader scrolled halfway down, the page lurches to a
     different section the moment the drawer opens.

     Cloning also keeps the panel a direct child of <body>, clear of the
     stacking context the theme's `animation: intro` creates on #main — from
     inside that context no z-index can lift the panel above the backdrop.

     The theme's `.toc` / `.toc__menu` rules are unscoped, so the clone picks
     up the styling for free. What it does not inherit is the scrollspy
     `.active` highlight, which is bound to the original node. -->

<div id="floating-nav">
  <button id="toc-toggle" type="button" aria-expanded="false" aria-label="Table of contents" title="Table of contents">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M4 6.5h16 M4 12h16 M4 17.5h16" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" />
    </svg>
  </button>
  <button id="back-to-top" type="button" aria-label="Back to top" title="Back to top">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M12 5.5 L5 12.5 M12 5.5 L19 12.5 M12 5.5 L12 19"
            fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
</div>

<div id="toc-backdrop" hidden></div>

<style>
  /* ------------------------------------------------------------------
     Floating buttons
     ------------------------------------------------------------------ */

  #floating-nav {
    position: fixed;
    right: 1rem;
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    z-index: 100;

    display: flex;
    flex-direction: column;
    gap: 0.6rem;

    /* hidden until scrolled; visibility (not just opacity) keeps the buttons
       out of the tab order and the accessibility tree while they are off */
    opacity: 0;
    visibility: hidden;
    transform: translateY(0.5rem);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  }

  #floating-nav.is-visible {
    opacity: 0.9;
    visibility: visible;
    transform: translateY(0);
  }

  #floating-nav:hover,
  #floating-nav:focus-within {
    opacity: 1;
  }

  #floating-nav button {
    /* 44px: minimum comfortable touch target */
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;

    /* dirt skin: $primary-color #343434 on $border-color #e9dcbe */
    color: #f3f3f3;
    background-color: #343434;
    border: 1px solid #e9dcbe;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    cursor: pointer;
  }

  /* pages without a TOC (home, about) keep only the back-to-top button */
  #floating-nav.no-toc #toc-toggle {
    display: none;
  }

  /* ------------------------------------------------------------------
     TOC panel
     ------------------------------------------------------------------ */

  #toc-backdrop {
    position: fixed;
    inset: 0;
    z-index: 105;
    background-color: rgba(52, 52, 52, 0.5);
    opacity: 0;
    transition: opacity 0.25s ease;
    /* swallows pan gestures, which is the whole scroll lock. The theme's
       `overflow--hidden` body class is NOT usable here: `overflow: hidden`
       on <body> establishes a block formatting context, and reflowing the
       theme's layout under it shortens the page by well over a thousand
       pixels — the reader watches the article jump to another section. */
    touch-action: none;
  }

  #toc-backdrop.is-open {
    opacity: 1;
  }

  /* Always mounted and always fixed, so it never takes part in layout and
     there is nothing to move on open. Off-screen and `visibility: hidden`
     keeps it out of the tab order until it is wanted. */
  #toc-panel {
    position: fixed;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 110;

    /* the vw term guarantees a strip of backdrop survives on the left, so
       there is always somewhere to tap to dismiss */
    width: min(86vw, 21rem);
    display: flex;
    flex-direction: column;

    transform: translateX(100%);
    visibility: hidden;
    transition: transform 0.25s ease, visibility 0.25s;
  }

  #toc-panel.is-open {
    transform: translateX(0);
    visibility: visible;
  }

  /* the clone's <nav> wrapper has to pass the panel's height through to the
     `.toc` inside it, or the menu has nothing to scroll within */
  #toc-panel > nav {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
  }

  /* fill the panel and let the menu scroll inside it; it runs flush to the
     top and right edges, so the theme's rounding has to go or it shows as
     notches against the viewport corners */
  #toc-panel .toc {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    margin: 0;
    border-radius: 0;
    border-top: 0;
    border-right: 0;
    border-bottom: 0;
  }

  #toc-panel .toc__menu {
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    /* stops a flick that runs past the end of the list from chaining into
       the article behind it */
    overscroll-behavior: contain;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* the panel covers the floating buttons, so its header carries the only
     visible dismiss control (backdrop tap and Escape also close it) */
  #toc-panel .toc > header {
    position: relative;
  }

  #toc-panel .nav__title {
    display: flex;
    align-items: center;
    /* flex drops the whitespace between the theme's icon and its label */
    gap: 0.5em;
    min-height: 2.75rem;
    padding-inline-end: 3rem;
    border-radius: 0;
    /* clears the notch / status bar, since the panel reaches the top edge */
    padding-top: env(safe-area-inset-top, 0px);
  }

  #toc-close {
    position: absolute;
    top: 0;
    inset-inline-end: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    color: #fff;
    background: none;
    border: 0;
    cursor: pointer;
  }

  /* $large — from here up the sticky sidebar is on screen and all of this
     is redundant */
  @media (min-width: 64em) {
    #floating-nav,
    #toc-backdrop,
    #toc-panel {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #floating-nav,
    #toc-backdrop,
    #toc-panel {
      transition: none;
    }
  }

  @media print {
    #floating-nav,
    #toc-backdrop,
    #toc-panel {
      display: none;
    }
  }

  /* ------------------------------------------------------------------
     Collapsible TOC sections. Applies wherever the theme's `.toc__menu`
     renders — the desktop sticky sidebar and the mobile drawer clone
     both pick this up, since the clone copies the sidebar's innerHTML
     *after* the script below has already mutated it.
     ------------------------------------------------------------------ */

  .toc__heading-row {
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    /* the <a> below only wraps its own text now, so the row itself is what
       the reader clicks to toggle -- give the whole strip a hand cursor,
       not just the text and the button */
    cursor: pointer;
    /* dirt skin $border-color; dark counterpart in assets/css/dark.scss.
       Moved here from the <a> below so the rule spans the toggle too. */
    border-bottom: 1px solid #e9dcbe;
  }

  /* Deliberately NOT flex: 1 1 auto. Stretching the <a> to fill the row
     would make its clickable box cover the empty space between the text
     and the toggle too, so a click there would navigate instead of
     collapsing. Sized to its own text, the empty strip belongs to the row
     (see the click handler below), and only the text and the button
     themselves navigate or toggle respectively. */
  .toc__heading-row > a {
    border-bottom: 0;
  }

  .toc__toggle {
    flex: 0 0 auto;
    width: 2rem;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
  }

  .toc__toggle svg {
    transition: transform 0.2s ease;
  }

  /* The theme's own `.toc .active a` colours only the <a>, sized to its
     own text (see above), so the toggle button sat outside the highlight
     and looked unstyled next to it. Painting the whole row instead reads
     as one continuous highlighted bar. The <a>'s own colour is repeated
     explicitly rather than left to inherit from the row -- the theme's
     `.toc__menu a` sets colour directly on the element, and a specified
     value there always wins over an inherited one regardless of the
     ancestor rule's specificity. */
  .toc .active > .toc__heading-row {
    background-color: #d6d6d6;
  }

  .toc .active > .toc__heading-row,
  .toc .active > .toc__heading-row a,
  .toc .active > .toc__heading-row .toc__toggle {
    color: #3d4144;
  }

  .toc__menu > li.is-collapsed > .toc__heading-row .toc__toggle svg {
    transform: rotate(-90deg);
  }

  @media (prefers-reduced-motion: reduce) {
    .toc__toggle svg {
      transition: none;
    }
  }
</style>

<script>
  (function () {
    var nav = document.getElementById("floating-nav");
    var backdrop = document.getElementById("toc-backdrop");
    var topBtn = document.getElementById("back-to-top");
    var tocBtn = document.getElementById("toc-toggle");
    if (!nav) return;

    var body = document.body;
    var sourceToc = document.querySelector(".sidebar__right .toc");
    var panel = null;
    var drawer = null;

    function reduceMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    /* --- collapse the big (h2) sections, collapsed by default ---

       Runs on the real sidebar TOC before the drawer clone below copies its
       innerHTML, so both the desktop sticky sidebar and the mobile drawer
       pick up the same collapsed markup for free. A single delegated click
       listener (bottom of this function) handles toggles in both copies,
       since innerHTML cloning doesn't carry event listeners along with it. */
    function makeCollapsible(tocNav) {
      var topMenu = tocNav.querySelector(".toc__menu");
      if (!topMenu) return;

      var items = Array.prototype.slice.call(topMenu.children);
      for (var i = 0; i < items.length; i++) {
        var li = items[i];
        var link = li.querySelector(":scope > a");
        var submenu = li.querySelector(":scope > ul");
        if (!link || !submenu) continue;

        var row = document.createElement("div");
        row.className = "toc__heading-row";
        li.insertBefore(row, link);
        row.appendChild(link);

        var toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "toc__toggle";
        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-label", "Toggle " + link.textContent.trim() + " section");
        toggle.innerHTML =
          '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">' +
          '<path d="M7 10 L12 15 L17 10" fill="none" stroke="currentColor" ' +
          'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>';
        row.appendChild(toggle);

        li.classList.add("is-collapsed");
        submenu.hidden = true;
      }
    }

    /* A click toggles unless it lands on the heading text itself (the <a>,
       sized to its own text -- see the CSS above), which navigates as
       normal. That covers the toggle button and the empty strip between
       the text and the button, both of which belong to the row, not to
       the link. */
    document.addEventListener("click", function (e) {
      var row = e.target.closest(".toc__heading-row");
      if (!row || e.target.closest("a")) return;

      var li = row.parentElement;
      var submenu = li.querySelector(":scope > ul");
      if (!submenu) return;

      var collapsed = li.classList.toggle("is-collapsed");
      submenu.hidden = collapsed;
      var toggle = row.querySelector(".toc__toggle");
      if (toggle) toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
    });

    /* --- open the section the reader is currently in, collapse the rest ---

       Gumshoe (the theme's scrollspy) bubbles a `gumshoeActivate` event up
       from whichever <li> it marks .active -- for every heading level it
       tracks, not just the top ones (`nested: false` in the theme's own
       init, so h3 activation doesn't also mark its parent h2). Walking up
       from that <li> to its top-level ancestor in .toc__menu says which h2
       section is current; every other top-level section collapses. */
    function expandActiveSection(tocRoot, activeLink) {
      var topMenu = tocRoot.querySelector(".toc__menu");
      if (!topMenu || !activeLink) return;

      var activeTop = null;
      var li = activeLink.closest("li");
      while (li) {
        if (li.parentElement === topMenu) {
          activeTop = li;
          break;
        }
        li = li.parentElement && li.parentElement.closest("li");
      }
      if (!activeTop) return;

      var items = topMenu.children;
      for (var i = 0; i < items.length; i++) {
        var top = items[i];
        var submenu = top.querySelector(":scope > ul");
        if (!submenu) continue; // not collapsible, nothing to do

        var open = top === activeTop;
        top.classList.toggle("is-collapsed", !open);
        submenu.hidden = !open;
        var toggle = top.querySelector(":scope > .toc__heading-row > .toc__toggle");
        if (toggle) toggle.setAttribute("aria-expanded", open ? "true" : "false");
      }
    }

    if (sourceToc) makeCollapsible(sourceToc);

    /* Registered before scripts.html loads main.min.js further down the
       page, so this is in place before the theme's own Gumshoe init runs
       its first, synchronous detect() -- the event this listens for is not
       missed on initial load. */
    if (sourceToc) {
      document.addEventListener("gumshoeActivate", function (e) {
        expandActiveSection(sourceToc, e.detail && e.detail.link);
      });
    }

    /* --- build the panel from a clone; the page's own TOC is never touched --- */

    if (!sourceToc) {
      // home and about have no TOC; hide that button and keep back-to-top
      nav.classList.add("no-toc");
    } else {
      /* A <nav> that does NOT carry the `toc` class, wrapping a div that
         does. Both halves are load-bearing:

         - It must be a <nav>. `_base.scss` scopes the list reset to `nav`
           — `li { list-style: none }`, `a { text-decoration: none }`,
           `ul { margin: 0; padding: 0 }`. Any other element and the menu
           comes back with bullets, underlines and a browser's default
           indent.
         - The <nav> must not match `nav.toc a`. The theme drives its
           scrollspy with `new Gumshoe("nav.toc a")`, and Gumshoe resolves
           duplicate links to the *last* match in document order, so a
           cloned <nav class="toc"> steals the highlight from the real TOC
           and keeps it even at desktop width, where the panel is
           `display: none` and the sticky sidebar is the only one on screen.

         Holding `toc` on the inner div satisfies both, since the theme's
         `.toc` rules never mention the element they sit on. */
      drawer = document.createElement("nav");
      drawer.id = "toc-drawer";
      drawer.setAttribute("aria-label", "Table of contents");

      var tocBox = document.createElement("div");
      tocBox.className = sourceToc.className;
      tocBox.innerHTML = sourceToc.innerHTML;
      drawer.appendChild(tocBox);

      panel = document.createElement("div");
      panel.id = "toc-panel";
      panel.appendChild(drawer);
      body.appendChild(panel);

      tocBtn.setAttribute("aria-controls", "toc-drawer");

      var header = drawer.querySelector("header");
      if (header) {
        var closeBtn = document.createElement("button");
        closeBtn.id = "toc-close";
        closeBtn.type = "button";
        closeBtn.setAttribute("aria-label", "Close table of contents");
        closeBtn.innerHTML =
          '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">' +
          '<path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="currentColor" ' +
          'stroke-width="2.2" stroke-linecap="round" /></svg>';
        closeBtn.addEventListener("click", function () {
          closeDrawer(true);
        });
        header.appendChild(closeBtn);
      }

      // jumping to a heading should dismiss the panel
      drawer.addEventListener("click", function (e) {
        if (e.target.closest("a")) closeDrawer(false);
      });
    }

    /* --- show / hide the buttons on scroll --- */

    var shown = false;
    var ticking = false;

    function update() {
      ticking = false;
      var should = window.pageYOffset > window.innerHeight;
      if (should !== shown) {
        shown = should;
        nav.classList.toggle("is-visible", shown);
      }
    }

    window.addEventListener("scroll", function () {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(update);
      }
    }, { passive: true });

    /* --- open / close --- */

    var closeTimer = null;

    function isOpen() {
      return !!panel && panel.classList.contains("is-open");
    }

    // focusing inside a fixed panel will scroll the document unless asked not
    // to, which is exactly the lurch this whole approach exists to avoid
    function focusQuietly(el) {
      try {
        el.focus({ preventScroll: true });
      } catch (e) {
        el.focus();
      }
    }

    /* Copy the scrollspy's current highlight from the real TOC onto the
       clone. Doing it once per open is enough: the backdrop blocks scrolling
       while the panel is up, so the reader cannot leave the section. */
    function syncActive() {
      if (!drawer || !sourceToc) return;

      var stale = drawer.querySelectorAll(".active");
      for (var i = 0; i < stale.length; i++) stale[i].classList.remove("active");

      var current = sourceToc.querySelector("li.active > a, li.active a");
      if (!current) return;

      var href = current.getAttribute("href");
      var links = drawer.querySelectorAll("a[href]");
      for (var j = 0; j < links.length; j++) {
        if (links[j].getAttribute("href") !== href) continue;
        var li = links[j].closest("li");
        if (li) li.classList.add("active");
        expandActiveSection(drawer, links[j]);
        return;
      }
    }

    function openDrawer() {
      if (!panel || isOpen()) return;
      window.clearTimeout(closeTimer);
      syncActive();

      backdrop.hidden = false;
      // force a reflow so the fade has a starting point to run from
      void backdrop.offsetHeight;

      panel.classList.add("is-open");
      backdrop.classList.add("is-open");

      tocBtn.setAttribute("aria-expanded", "true");
      drawer.setAttribute("tabindex", "-1");
      focusQuietly(drawer);
    }

    function closeDrawer(returnFocus) {
      if (!panel || !isOpen()) return;

      panel.classList.remove("is-open");
      backdrop.classList.remove("is-open");
      tocBtn.setAttribute("aria-expanded", "false");
      drawer.removeAttribute("tabindex");

      window.clearTimeout(closeTimer);
      closeTimer = window.setTimeout(function () {
        backdrop.hidden = true;
      }, reduceMotion() ? 0 : 250);

      if (returnFocus) focusQuietly(tocBtn);
    }

    tocBtn.addEventListener("click", function () {
      if (isOpen()) closeDrawer(true);
      else openDrawer();
    });

    backdrop.addEventListener("click", function () {
      closeDrawer(true);
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" || e.key === "Esc") closeDrawer(true);
    });

    // the panel only exists below $large; don't let it linger past a rotate
    window.addEventListener("resize", function () {
      if (isOpen() && window.innerWidth >= 1024) closeDrawer(false);
    });

    /* --- back to top --- */

    topBtn.addEventListener("click", function () {
      closeDrawer(false);
      window.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" });
    });

    update();
  })();
</script>

<!-- end custom footer snippets -->
