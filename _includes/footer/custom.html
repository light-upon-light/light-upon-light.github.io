<!-- Floating navigation for narrow viewports. At $large and up the theme's
     sticky TOC sidebar sits alongside the text, so none of this is needed and
     all of it is hidden. Below that the TOC collapses to an inline block at
     the top of the article and scrolling is the only way back to it.

     The panel is built from a *clone* of the theme's TOC. Repositioning the
     real `.sidebar__right` looks tidier but cannot work: going `position:
     fixed` pulls that node out of the document flow, and it is a tall block
     near the top of the article, so everything below it jumps up by its full
     height. To a reader scrolled halfway down, the page lurches to a
     different section the moment the drawer opens.

     Cloning also keeps the panel a direct child of <body>, clear of the
     stacking context the theme's `animation: intro` creates on #main — from
     inside that context no z-index can lift the panel above the backdrop.

     The theme's `.toc` / `.toc__menu` rules are unscoped, so the clone picks
     up the styling for free. What it does not inherit is the scrollspy
     `.active` highlight, which is bound to the original node. -->

<div id="floating-nav">
  <button id="toc-toggle" type="button" aria-expanded="false" aria-label="Table of contents" title="Table of contents">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M4 6.5h16 M4 12h16 M4 17.5h16" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" />
    </svg>
  </button>
  <button id="back-to-top" type="button" aria-label="Back to top" title="Back to top">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M12 5.5 L5 12.5 M12 5.5 L19 12.5 M12 5.5 L12 19"
            fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
</div>

<div id="toc-backdrop" hidden></div>

<style>
  /* ------------------------------------------------------------------
     Floating buttons
     ------------------------------------------------------------------ */

  #floating-nav {
    position: fixed;
    right: 1rem;
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    z-index: 100;

    display: flex;
    flex-direction: column;
    gap: 0.6rem;

    /* hidden until scrolled; visibility (not just opacity) keeps the buttons
       out of the tab order and the accessibility tree while they are off */
    opacity: 0;
    visibility: hidden;
    transform: translateY(0.5rem);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  }

  #floating-nav.is-visible {
    opacity: 0.9;
    visibility: visible;
    transform: translateY(0);
  }

  #floating-nav:hover,
  #floating-nav:focus-within {
    opacity: 1;
  }

  #floating-nav button {
    /* 44px: minimum comfortable touch target */
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;

    /* dirt skin: $primary-color #343434 on $border-color #e9dcbe */
    color: #f3f3f3;
    background-color: #343434;
    border: 1px solid #e9dcbe;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    cursor: pointer;
  }

  /* pages without a TOC (home, about) keep only the back-to-top button */
  #floating-nav.no-toc #toc-toggle {
    display: none;
  }

  /* ------------------------------------------------------------------
     TOC panel
     ------------------------------------------------------------------ */

  #toc-backdrop {
    position: fixed;
    inset: 0;
    z-index: 105;
    background-color: rgba(52, 52, 52, 0.5);
    opacity: 0;
    transition: opacity 0.25s ease;
    /* swallows pan gestures, which is the whole scroll lock. The theme's
       `overflow--hidden` body class is NOT usable here: `overflow: hidden`
       on <body> establishes a block formatting context, and reflowing the
       theme's layout under it shortens the page by well over a thousand
       pixels — the reader watches the article jump to another section. */
    touch-action: none;
  }

  #toc-backdrop.is-open {
    opacity: 1;
  }

  /* Always mounted and always fixed, so it never takes part in layout and
     there is nothing to move on open. Off-screen and `visibility: hidden`
     keeps it out of the tab order until it is wanted. */
  #toc-panel {
    position: fixed;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 110;

    /* the vw term guarantees a strip of backdrop survives on the left, so
       there is always somewhere to tap to dismiss */
    width: min(86vw, 21rem);
    display: flex;
    flex-direction: column;

    transform: translateX(100%);
    visibility: hidden;
    transition: transform 0.25s ease, visibility 0.25s;
  }

  #toc-panel.is-open {
    transform: translateX(0);
    visibility: visible;
  }

  /* fill the panel and let the menu scroll inside it; it runs flush to the
     top and right edges, so the theme's rounding has to go or it shows as
     notches against the viewport corners */
  #toc-panel .toc {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    margin: 0;
    border-radius: 0;
    border-top: 0;
    border-right: 0;
    border-bottom: 0;
  }

  #toc-panel .toc__menu {
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    /* stops a flick that runs past the end of the list from chaining into
       the article behind it */
    overscroll-behavior: contain;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* the panel covers the floating buttons, so its header carries the only
     visible dismiss control (backdrop tap and Escape also close it) */
  #toc-panel .toc > header {
    position: relative;
  }

  #toc-panel .nav__title {
    display: flex;
    align-items: center;
    /* flex drops the whitespace between the theme's icon and its label */
    gap: 0.5em;
    min-height: 2.75rem;
    padding-inline-end: 3rem;
    border-radius: 0;
    /* clears the notch / status bar, since the panel reaches the top edge */
    padding-top: env(safe-area-inset-top, 0px);
  }

  #toc-close {
    position: absolute;
    top: 0;
    inset-inline-end: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    color: #fff;
    background: none;
    border: 0;
    cursor: pointer;
  }

  /* $large — from here up the sticky sidebar is on screen and all of this
     is redundant */
  @media (min-width: 64em) {
    #floating-nav,
    #toc-backdrop,
    #toc-panel {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #floating-nav,
    #toc-backdrop,
    #toc-panel {
      transition: none;
    }
  }

  @media print {
    #floating-nav,
    #toc-backdrop,
    #toc-panel {
      display: none;
    }
  }
</style>

<script>
  (function () {
    var nav = document.getElementById("floating-nav");
    var backdrop = document.getElementById("toc-backdrop");
    var topBtn = document.getElementById("back-to-top");
    var tocBtn = document.getElementById("toc-toggle");
    if (!nav) return;

    var body = document.body;
    var sourceToc = document.querySelector(".sidebar__right .toc");
    var panel = null;
    var drawer = null;

    function reduceMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    /* --- build the panel from a clone; the page's own TOC is never touched --- */

    if (!sourceToc) {
      // home and about have no TOC; hide that button and keep back-to-top
      nav.classList.add("no-toc");
    } else {
      /* A <div>, deliberately, not a <nav>. The theme drives its scrollspy
         with `new Gumshoe("nav.toc a")`, and Gumshoe resolves duplicate links
         to the *last* match in document order — so a cloned <nav class="toc">
         steals the highlight from the real TOC and holds it even at desktop
         width, where the panel is `display: none` and the sticky sidebar is
         the only one on screen. Not matching that selector leaves the real
         TOC alone; syncActive() mirrors the state back on open. */
      drawer = document.createElement("div");
      drawer.className = sourceToc.className;
      drawer.id = "toc-drawer";
      drawer.setAttribute("role", "navigation");
      drawer.setAttribute("aria-label", "Table of contents");
      drawer.innerHTML = sourceToc.innerHTML;

      panel = document.createElement("div");
      panel.id = "toc-panel";
      panel.appendChild(drawer);
      body.appendChild(panel);

      tocBtn.setAttribute("aria-controls", "toc-drawer");

      var header = drawer.querySelector("header");
      if (header) {
        var closeBtn = document.createElement("button");
        closeBtn.id = "toc-close";
        closeBtn.type = "button";
        closeBtn.setAttribute("aria-label", "Close table of contents");
        closeBtn.innerHTML =
          '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">' +
          '<path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="currentColor" ' +
          'stroke-width="2.2" stroke-linecap="round" /></svg>';
        closeBtn.addEventListener("click", function () {
          closeDrawer(true);
        });
        header.appendChild(closeBtn);
      }

      // jumping to a heading should dismiss the panel
      drawer.addEventListener("click", function (e) {
        if (e.target.closest("a")) closeDrawer(false);
      });
    }

    /* --- show / hide the buttons on scroll --- */

    var shown = false;
    var ticking = false;

    function update() {
      ticking = false;
      var should = window.pageYOffset > window.innerHeight;
      if (should !== shown) {
        shown = should;
        nav.classList.toggle("is-visible", shown);
      }
    }

    window.addEventListener("scroll", function () {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(update);
      }
    }, { passive: true });

    /* --- open / close --- */

    var closeTimer = null;

    function isOpen() {
      return !!panel && panel.classList.contains("is-open");
    }

    // focusing inside a fixed panel will scroll the document unless asked not
    // to, which is exactly the lurch this whole approach exists to avoid
    function focusQuietly(el) {
      try {
        el.focus({ preventScroll: true });
      } catch (e) {
        el.focus();
      }
    }

    /* Copy the scrollspy's current highlight from the real TOC onto the
       clone. Doing it once per open is enough: the backdrop blocks scrolling
       while the panel is up, so the reader cannot leave the section. */
    function syncActive() {
      if (!drawer || !sourceToc) return;

      var stale = drawer.querySelectorAll(".active");
      for (var i = 0; i < stale.length; i++) stale[i].classList.remove("active");

      var current = sourceToc.querySelector("li.active > a, li.active a");
      if (!current) return;

      var href = current.getAttribute("href");
      var links = drawer.querySelectorAll("a[href]");
      for (var j = 0; j < links.length; j++) {
        if (links[j].getAttribute("href") !== href) continue;
        var li = links[j].closest("li");
        if (li) li.classList.add("active");
        return;
      }
    }

    function openDrawer() {
      if (!panel || isOpen()) return;
      window.clearTimeout(closeTimer);
      syncActive();

      backdrop.hidden = false;
      // force a reflow so the fade has a starting point to run from
      void backdrop.offsetHeight;

      panel.classList.add("is-open");
      backdrop.classList.add("is-open");

      tocBtn.setAttribute("aria-expanded", "true");
      drawer.setAttribute("tabindex", "-1");
      focusQuietly(drawer);
    }

    function closeDrawer(returnFocus) {
      if (!panel || !isOpen()) return;

      panel.classList.remove("is-open");
      backdrop.classList.remove("is-open");
      tocBtn.setAttribute("aria-expanded", "false");
      drawer.removeAttribute("tabindex");

      window.clearTimeout(closeTimer);
      closeTimer = window.setTimeout(function () {
        backdrop.hidden = true;
      }, reduceMotion() ? 0 : 250);

      if (returnFocus) focusQuietly(tocBtn);
    }

    tocBtn.addEventListener("click", function () {
      if (isOpen()) closeDrawer(true);
      else openDrawer();
    });

    backdrop.addEventListener("click", function () {
      closeDrawer(true);
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" || e.key === "Esc") closeDrawer(true);
    });

    // the panel only exists below $large; don't let it linger past a rotate
    window.addEventListener("resize", function () {
      if (isOpen() && window.innerWidth >= 1024) closeDrawer(false);
    });

    /* --- back to top --- */

    topBtn.addEventListener("click", function () {
      closeDrawer(false);
      window.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" });
    });

    update();
  })();
</script>

<!-- end custom footer snippets -->
