<!-- start custom footer snippets -->

{% if page.quran_section %}
<!-- Breadcrumb trail (Home / quran.md / section on quran.md / this page),
     built here rather than written into the markdown so it is never part of
     .page__content -- Lunr indexes that container verbatim (see
     search_full_content in CLAUDE.md), and a static link there would sit as
     literal page text, becoming the truncated snippet shown for every search
     hit on this page. Injected directly above #page-title at runtime, the
     conventional breadcrumb position, and kept out of the indexed content in
     the same move. It needs no referrer check: the section a sub-page
     belongs to is fixed at build time, not a claim about how this
     particular reader arrived.

     Each crumb's label is page.short_title where one is set (see quran.md
     and the sub-pages for examples) -- full page titles here are often long
     enough ("The Prophet Muhammad's ﷺ Marriage to Aisha: A Historical,
     Moral, and Islamic Examination") that a breadcrumb built from them
     wraps and reads poorly. Falls back to the full title where no
     short_title exists.

     The plain return link near the end of the article (back-to-quran.html)
     is a different kind of claim -- "back to where you were" -- so that one
     stays conditional on document.referrer actually being /quran. -->
<style>
  /* Sits above #page-title (see the script below), the conventional
     breadcrumb position -- bottom margin only, so it reads as attached to
     the title it precedes rather than floating between two things. 0.6em
     read as cramped in practice, sitting almost flush against the title. */
  .quran-breadcrumb {
    margin: 0 0 1.2em;
  }

  /* #page-title's own bottom margin (the theme default, ~0.5em) used to be
     enough because the breadcrumb sat below the title and its 1.6em bottom
     margin was doing the real work of separating title from body content.
     Now that the breadcrumb sits above the title instead, that spacing is
     gone and the title crowds the content that follows it -- so restore it
     here, scoped to pages with this breadcrumb rather than changing the
     theme default everywhere. */
  .quran-breadcrumb + #page-title {
    margin-bottom: 1em;
  }

  .quran-breadcrumb ol {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    margin: 0;
    padding: 0;
    list-style: none;
    font-family: "Karla", -apple-system, BlinkMacSystemFont, "Roboto",
                 "Segoe UI", Arial, sans-serif;
    font-size: 0.8em;
  }

  .quran-breadcrumb li {
    display: flex;
    align-items: baseline;
  }

  /* kramdown/GFM renders a literal "›" as three bytes; the numeric
     reference is unambiguous regardless of source encoding */
  .quran-breadcrumb li + li::before {
    content: "\203a";
    margin: 0 0.5em;
    color: var(--site-breadcrumb-sep);
  }

  .quran-breadcrumb a {
    color: var(--mm-muted-text-color);
    text-decoration: none;
  }

  .page__content .quran-breadcrumb a:hover {
    color: var(--mm-text-color);
    text-decoration: underline;
  }

  .quran-breadcrumb li[aria-current="page"] {
    color: var(--site-src-text);
  }
</style>
{% assign quran_page = site.pages | where: "permalink", "/quran" | first %}
<script>
  (function () {
    var quranSection = {{ page.quran_section | jsonify }};
    var quranSectionLabel = {{ page.quran_section_label | jsonify }};
    var quranTitle = {{ quran_page.short_title | default: quran_page.title | strip_html | jsonify }};
    var currentTitle = {{ page.short_title | default: page.title | strip_html | jsonify }};

    // return link near the end of the article: only claims "back to where
    // you were" when the referrer really was /quran
    var returnHref = "/quran";
    try {
      if (document.referrer) {
        var ref = new URL(document.referrer);
        if (ref.origin === window.location.origin &&
            ref.pathname.replace(/\/+$/, "") === "/quran") {
          returnHref = "/quran#" + quranSection;
        }
      }
    } catch (e) {}

    var returnLink = document.querySelector("a.back-to-quran-link");
    if (returnLink) returnLink.href = returnHref;

    // breadcrumb: a fixed statement of the site's structure, not a guess
    // about navigation history, so it always targets the real section
    var h1 = document.getElementById("page-title");
    if (h1) {
      var nav = document.createElement("nav");
      nav.className = "quran-breadcrumb";
      nav.setAttribute("aria-label", "Breadcrumb");

      var ol = document.createElement("ol");

      var quran = document.createElement("li");
      var quranLink = document.createElement("a");
      quranLink.href = "/quran";
      quranLink.textContent = quranTitle;
      quran.appendChild(quranLink);
      ol.appendChild(quran);

      var section = document.createElement("li");
      var sectionLink = document.createElement("a");
      sectionLink.href = "/quran#" + quranSection;
      sectionLink.textContent = quranSectionLabel;
      section.appendChild(sectionLink);
      ol.appendChild(section);

      var current = document.createElement("li");
      current.setAttribute("aria-current", "page");
      current.textContent = currentTitle;
      ol.appendChild(current);

      nav.appendChild(ol);
      h1.insertAdjacentElement("beforebegin", nav);
    }
  })();
</script>
{% endif %}

<!-- Floating navigation for narrow viewports. At $large and up the theme's
     sticky TOC sidebar sits alongside the text, so none of this is needed and
     all of it is hidden. Below that the TOC collapses to an inline block at
     the top of the article and scrolling is the only way back to it.

     The panel is built from a *clone* of the theme's TOC. Repositioning the
     real `.sidebar__right` looks tidier but cannot work: going `position:
     fixed` pulls that node out of the document flow, and it is a tall block
     near the top of the article, so everything below it jumps up by its full
     height. To a reader scrolled halfway down, the page lurches to a
     different section the moment the drawer opens.

     Cloning also keeps the panel a direct child of <body>, clear of the
     stacking context the theme's `animation: intro` creates on #main — from
     inside that context no z-index can lift the panel above the backdrop.

     The theme's `.toc` / `.toc__menu` rules are unscoped, so the clone picks
     up the styling for free. What it does not inherit is the scrollspy
     `.active` highlight, which is bound to the original node. -->

<div id="floating-nav">
  <!-- Appearance pair, plus back-to-top: two columns of three, laid out by
       grid-auto-flow: column below -- text size/theme/back-to-top on the
       left, prev/next/TOC on the right. Appearance controls are the same
       two as the masthead, which has scrolled away by the time #floating-nav
       appears. Distinct IDs, shared classes: the scripts in head/custom.html
       bind and sync by class (see there), while the ID-scoped CSS keeps the
       masthead copies' transparent styling off these, which sit on a dark
       translucent disc instead.

       Icons are copied from _includes/masthead.html at 20x20 to match the
       navigation buttons below rather than the 26x26 used in the masthead;
       the sun's deliberately-scaled geometry is preserved as-is. -->
  <button id="floating-font-size-toggle" class="font-size-toggle" type="button" aria-pressed="false" aria-label="Switch to larger text size" title="Switch to larger text size">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <text x="1" y="16" font-size="11" font-family="Georgia, 'Times New Roman', serif" fill="currentColor">A</text>
      <text x="10" y="19" font-size="17" font-family="Georgia, 'Times New Roman', serif" fill="currentColor">A</text>
    </svg>
  </button>
  <button id="floating-theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg class="theme-toggle__moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"
            fill="currentColor" />
    </svg>
    <svg class="theme-toggle__sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="3.4" fill="currentColor" />
      <path d="M12 3.8v2.1 M12 18.1v2.1 M3.8 12h2.1 M18.1 12h2.1 M6.2 6.2l1.5 1.5 M16.3 16.3l1.5 1.5 M17.8 6.2l-1.5 1.5 M7.7 16.3l-1.5 1.5"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
  <button id="back-to-top" type="button" aria-label="Back to top" title="Back to top">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M12 5.5 L5 12.5 M12 5.5 L19 12.5 M12 5.5 L12 19"
            fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <!-- Bare chevrons, no stem -- deliberately distinct from #back-to-top's
       full arrow-with-stem above, since both point roughly the same
       direction and would otherwise be hard to tell apart at a glance. -->
  <button id="prev-section" type="button" aria-label="Previous section" title="Previous section">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M5 14 L12 7 L19 14" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <button id="next-section" type="button" aria-label="Next section" title="Next section">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M5 10 L12 17 L19 10" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <button id="toc-toggle" type="button" aria-expanded="false" aria-label="Table of contents" title="Table of contents">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M4 6.5h16 M4 12h16 M4 17.5h16" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" />
    </svg>
  </button>
</div>

<div id="toc-backdrop" hidden></div>


<!-- end custom footer snippets -->
