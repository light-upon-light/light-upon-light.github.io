<!-- start custom footer snippets -->

<!-- Floating navigation for narrow viewports. At $large and up the theme's
     sticky TOC sidebar sits alongside the text, so none of this is needed and
     all of it is hidden. Below that the TOC collapses to an inline block at
     the top of the article and scrolling is the only way back to it.

     The panel is built from a *clone* of the theme's TOC. Repositioning the
     real `.sidebar__right` looks tidier but cannot work: going `position:
     fixed` pulls that node out of the document flow, and it is a tall block
     near the top of the article, so everything below it jumps up by its full
     height. To a reader scrolled halfway down, the page lurches to a
     different section the moment the drawer opens.

     Cloning also keeps the panel a direct child of <body>, clear of the
     stacking context the theme's `animation: intro` creates on #main — from
     inside that context no z-index can lift the panel above the backdrop.

     The theme's `.toc` / `.toc__menu` rules are unscoped, so the clone picks
     up the styling for free. What it does not inherit is the scrollspy
     `.active` highlight, which is bound to the original node. -->

<div id="floating-nav">
  <!-- Bare chevrons, no stem -- deliberately distinct from #back-to-top's
       full arrow-with-stem below, since both point roughly the same
       direction and would otherwise be hard to tell apart at a glance. -->
  <button id="prev-section" type="button" aria-label="Previous section" title="Previous section">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M5 14 L12 7 L19 14" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <button id="next-section" type="button" aria-label="Next section" title="Next section">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M5 10 L12 17 L19 10" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <button id="toc-toggle" type="button" aria-expanded="false" aria-label="Table of contents" title="Table of contents">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M4 6.5h16 M4 12h16 M4 17.5h16" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" />
    </svg>
  </button>
  <button id="back-to-top" type="button" aria-label="Back to top" title="Back to top">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path d="M12 5.5 L5 12.5 M12 5.5 L19 12.5 M12 5.5 L12 19"
            fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
</div>

<div id="toc-backdrop" hidden></div>

<style>
  /* ------------------------------------------------------------------
     Floating buttons
     ------------------------------------------------------------------ */

  #floating-nav {
    position: fixed;
    right: 1rem;
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    z-index: 100;

    display: flex;
    flex-direction: column;
    gap: 0.6rem;

    /* hidden until scrolled; visibility (not just opacity) keeps the buttons
       out of the tab order and the accessibility tree while they are off */
    opacity: 0;
    visibility: hidden;
    transform: translateY(0.5rem);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  }

  #floating-nav.is-visible {
    opacity: 0.9;
    visibility: visible;
    transform: translateY(0);
  }

  #floating-nav:hover,
  #floating-nav:focus-within {
    opacity: 1;
  }

  #floating-nav button {
    /* 44px: minimum comfortable touch target */
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;

    /* dirt skin: $primary-color #343434 on $border-color #e9dcbe. Alpha'd
       down so text scrolled underneath stays readable through the button;
       dark counterpart in assets/css/dark.scss. */
    color: #f3f3f3;
    background-color: rgba(52, 52, 52, 0.55);
    border: 1px solid #e9dcbe;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    cursor: pointer;
  }

  /* Plain HTML added by this repo, not part of the theme's compiled CSS --
     so it never picked up the theme's own :focus-visible-gated ring and
     instead shows the browser's raw UA outline on ANY focus, including a
     mobile tap (reliably, on the round toc-toggle button in particular).
     :not(:focus-visible) keeps the ring for real keyboard navigation and
     drops it everywhere else. .toc__toggle and #toc-close get the same
     treatment further down, for the same reason. */
  #floating-nav button:focus:not(:focus-visible) {
    outline: none;
  }

  /* pages without a TOC (home, about) keep only the back-to-top button --
     there are no sections to navigate between either */
  #floating-nav.no-toc #toc-toggle,
  #floating-nav.no-toc #prev-section,
  #floating-nav.no-toc #next-section {
    display: none;
  }

  #floating-nav button:disabled {
    opacity: 0.35;
    cursor: default;
  }

  /* ------------------------------------------------------------------
     TOC panel
     ------------------------------------------------------------------ */

  #toc-backdrop {
    position: fixed;
    inset: 0;
    z-index: 105;
    background-color: rgba(52, 52, 52, 0.5);
    opacity: 0;
    transition: opacity 0.25s ease;
    /* swallows pan gestures, which is the whole scroll lock. The theme's
       `overflow--hidden` body class is NOT usable here: `overflow: hidden`
       on <body> establishes a block formatting context, and reflowing the
       theme's layout under it shortens the page by well over a thousand
       pixels — the reader watches the article jump to another section. */
    touch-action: none;
  }

  #toc-backdrop.is-open {
    opacity: 1;
  }

  /* Always mounted and always fixed, so it never takes part in layout and
     there is nothing to move on open. Off-screen and `visibility: hidden`
     keeps it out of the tab order until it is wanted. */
  #toc-panel {
    position: fixed;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 110;

    /* the vw term guarantees a strip of backdrop survives on the left, so
       there is always somewhere to tap to dismiss */
    width: min(86vw, 21rem);
    display: flex;
    flex-direction: column;

    transform: translateX(100%);
    visibility: hidden;
    transition: transform 0.25s ease, visibility 0.25s;
  }

  #toc-panel.is-open {
    transform: translateX(0);
    visibility: visible;
  }

  /* the clone's <nav> wrapper has to pass the panel's height through to the
     `.toc` inside it, or the menu has nothing to scroll within */
  #toc-panel > nav {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
  }

  /* fill the panel and let the menu scroll inside it; it runs flush to the
     top and right edges, so the theme's rounding has to go or it shows as
     notches against the viewport corners */
  #toc-panel .toc {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    margin: 0;
    border-radius: 0;
    border-top: 0;
    border-right: 0;
    border-bottom: 0;
  }

  #toc-panel .toc__menu {
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    /* stops a flick that runs past the end of the list from chaining into
       the article behind it */
    overscroll-behavior: contain;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* the panel covers the floating buttons, so its header carries the only
     visible dismiss control (backdrop tap and Escape also close it) */
  #toc-panel .toc > header {
    position: relative;
  }

  #toc-panel .nav__title {
    display: flex;
    align-items: center;
    /* flex drops the whitespace between the theme's icon and its label */
    gap: 0.5em;
    min-height: 2.75rem;
    padding-inline-end: 3rem;
    border-radius: 0;
    /* the theme's own .nav__title rule gives this 0.5rem of bottom padding;
       matching it on top (before adding the safe-area inset) keeps the
       icon/label centred in the box instead of sitting high against a
       lopsided top/bottom padding split. Clears the notch / status bar,
       since the panel reaches the top edge. */
    padding-top: calc(0.5rem + env(safe-area-inset-top, 0px));
  }

  #toc-close {
    position: absolute;
    top: 0;
    inset-inline-end: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    color: #fff;
    background: none;
    border: 0;
    cursor: pointer;
  }

  #toc-close:focus:not(:focus-visible) {
    outline: none;
  }

  /* $large — from here up the sticky sidebar is on screen and all of this
     is redundant */
  @media (min-width: 64em) {
    #floating-nav,
    #toc-backdrop,
    #toc-panel {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #floating-nav,
    #toc-backdrop,
    #toc-panel {
      transition: none;
    }
  }

  @media print {
    #floating-nav,
    #toc-backdrop,
    #toc-panel {
      display: none;
    }
  }

  /* ------------------------------------------------------------------
     Collapsible TOC sections. Applies wherever the theme's `.toc__menu`
     renders — the desktop sticky sidebar and the mobile drawer clone
     both pick this up, since the clone copies the sidebar's innerHTML
     *after* the script below has already mutated it.
     ------------------------------------------------------------------ */

  .toc__heading-row {
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    /* the <a> below only wraps its own text now, so the row itself is what
       the reader clicks to toggle -- give the whole strip a hand cursor,
       not just the text and the button */
    cursor: pointer;
    /* dirt skin $border-color; dark counterpart in assets/css/dark.scss.
       Moved here from the <a> below so the rule spans the toggle too. */
    border-bottom: 1px solid #e9dcbe;
  }

  /* Deliberately NOT flex: 1 1 auto. Stretching the <a> to fill the row
     would make its clickable box cover the empty space between the text
     and the toggle too, so a click there would navigate instead of
     collapsing. Sized to its own text, the empty strip belongs to the row
     (see the click handler below), and only the text and the button
     themselves navigate or toggle respectively. */
  .toc__heading-row > a {
    border-bottom: 0;
  }

  .toc__toggle {
    flex: 0 0 auto;
    width: 2rem;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
  }

  .toc__toggle:focus:not(:focus-visible) {
    outline: none;
  }

  .toc__toggle svg {
    transition: transform 0.2s ease;
  }

  /* The theme's own `.toc .active a` colours only the <a>, sized to its
     own text (see above), so the toggle button sat outside the highlight
     and looked unstyled next to it. Painting the whole row instead reads
     as one continuous highlighted bar. The <a>'s own colour is repeated
     explicitly rather than left to inherit from the row -- the theme's
     `.toc__menu a` sets colour directly on the element, and a specified
     value there always wins over an inherited one regardless of the
     ancestor rule's specificity. */
  .toc .active > .toc__heading-row {
    background-color: #d6d6d6;
  }

  .toc .active > .toc__heading-row,
  .toc .active > .toc__heading-row a,
  .toc .active > .toc__heading-row .toc__toggle {
    color: #3d4144;
  }

  /* The theme puts `transition: 0.2s ease-in-out` on bare `a` (among other
     elements) but not on a plain `<button>` -- so on activate/deactivate,
     `.toc__toggle`'s colour snaps instantly while the row's own <a> fades
     over 200ms, and the two visibly fall out of sync ("the toggle loses
     its highlight before the text" in one direction, or lags behind it in
     the other). Forcing both to snap together is more consistent for a
     scrollspy highlight than a lingering fade. */
  .toc__menu a,
  .toc__toggle {
    transition: none;
  }

  /* Any depth, not just `.toc__menu > li` -- the h3 groups collapse too. */
  .toc li.is-collapsed > .toc__heading-row .toc__toggle svg {
    transform: rotate(-90deg);
  }

  @media (prefers-reduced-motion: reduce) {
    .toc__toggle svg {
      transition: none;
    }
  }
</style>

<script>
  (function () {
    var nav = document.getElementById("floating-nav");
    var backdrop = document.getElementById("toc-backdrop");
    var topBtn = document.getElementById("back-to-top");
    var tocBtn = document.getElementById("toc-toggle");
    var prevBtn = document.getElementById("prev-section");
    var nextBtn = document.getElementById("next-section");
    if (!nav) return;

    var body = document.body;
    var sourceToc = document.querySelector(".sidebar__right .toc");
    var panel = null;
    var drawer = null;

    function reduceMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    /* --- collapse the h2 sections and the h3 groups inside them ---

       Runs on the real sidebar TOC before the drawer clone below copies its
       innerHTML, so both the desktop sticky sidebar and the mobile drawer
       pick up the same collapsed markup for free. A single delegated click
       listener (bottom of this function) handles toggles in both copies,
       since innerHTML cloning doesn't carry event listeners along with it.

       Collapsing is by the `hidden` attribute, not a CSS rule -- the UA
       stylesheet's `[hidden] { display: none }` does the hiding, which is
       why nothing here or in head/custom.html needs a display rule to
       match. Anything that inspects TOC state must read `.hidden`, not
       the document's own stylesheets. */
    function decorateList(list) {
      var items = Array.prototype.slice.call(list.children);
      for (var i = 0; i < items.length; i++) {
        var li = items[i];
        var link = li.querySelector(":scope > a");
        var submenu = li.querySelector(":scope > ul");
        if (!link || !submenu) continue;

        var row = document.createElement("div");
        row.className = "toc__heading-row";
        li.insertBefore(row, link);
        row.appendChild(link);

        var toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "toc__toggle";
        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-label", "Toggle " + link.textContent.trim() + " section");
        toggle.innerHTML =
          '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">' +
          '<path d="M7 10 L12 15 L17 10" fill="none" stroke="currentColor" ' +
          'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>';
        row.appendChild(toggle);

        li.classList.add("is-collapsed");
        submenu.hidden = true;
      }
    }

    /* Two levels, because a page with many h3s under one h2 (quran.md) fills
       the whole sidebar the moment its h2 opens. Grouping those h3s and
       collapsing them too means only the group the reader is actually in
       shows its h4s.

       The second pass reads `:scope > li > ul` *after* the first has run,
       which is safe: decorateList moves only the <a> into the new row, so
       the submenu stays a direct child of its <li>. An <li> with no
       submenu -- an h3 with no h4s under it -- gets no row and no chevron
       and stays a plain link. */
    function makeCollapsible(tocNav) {
      var topMenu = tocNav.querySelector(".toc__menu");
      if (!topMenu) return;

      decorateList(topMenu);

      var subLists = topMenu.querySelectorAll(":scope > li > ul");
      for (var i = 0; i < subLists.length; i++) decorateList(subLists[i]);
    }

    /* A click toggles unless it lands on the heading text itself (the <a>,
       sized to its own text -- see the CSS above), which navigates as
       normal. That covers the toggle button and the empty strip between
       the text and the button, both of which belong to the row, not to
       the link. */
    document.addEventListener("click", function (e) {
      var row = e.target.closest(".toc__heading-row");
      if (!row || e.target.closest("a")) return;

      var li = row.parentElement;
      var submenu = li.querySelector(":scope > ul");
      if (!submenu) return;

      var collapsed = li.classList.toggle("is-collapsed");
      submenu.hidden = collapsed;
      var toggle = row.querySelector(".toc__toggle");
      if (toggle) toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
    });

    /* --- open the section the reader is currently in, collapse the rest ---

       Gumshoe (the theme's scrollspy) bubbles a `gumshoeActivate` event up
       from whichever <li> it marks .active -- for every heading level it
       tracks, not just the top ones (`nested: false` in the theme's own
       init, so h3 activation doesn't also mark its parent h2). Walking up
       from that <li> to its ancestors in .toc__menu gives the chain of
       sections the reader is inside; each one opens and its siblings at
       that level collapse. Two levels deep now, so landing in an h4 opens
       its h2 *and* its h3 group while every other group stays shut.

       Gumshoe activates the h4 directly, not its h3 group heading -- which
       is also why the chain walk, rather than the h3 being active, is what
       drives this: a bare `### Group` immediately followed by `#### Sub`
       has almost no scroll height and is rarely the active item. */
    function setOpenSibling(list, activeLi) {
      var items = list.children;
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var submenu = item.querySelector(":scope > ul");
        if (!submenu) continue; // not collapsible, nothing to do

        var open = item === activeLi;
        item.classList.toggle("is-collapsed", !open);
        submenu.hidden = !open;
        var toggle = item.querySelector(":scope > .toc__heading-row > .toc__toggle");
        if (toggle) toggle.setAttribute("aria-expanded", open ? "true" : "false");
      }
    }

    function expandActiveSection(tocRoot, activeLink) {
      var topMenu = tocRoot.querySelector(".toc__menu");
      if (!topMenu || !activeLink) return;

      /* outermost first. The `contains` guard keeps a link from the drawer
         clone (a separate DOM tree) from producing a bogus chain. */
      var chain = [];
      var li = activeLink.closest("li");
      while (li && topMenu.contains(li)) {
        chain.unshift(li);
        li = li.parentElement && li.parentElement.closest("li");
      }
      if (!chain.length) return;

      var list = topMenu;
      for (var d = 0; d < chain.length; d++) {
        setOpenSibling(list, chain[d]);
        list = chain[d].querySelector(":scope > ul");
        if (!list) break;
      }

      /* Anything below where the chain ran out closes. Without this,
         arriving at an h2 heading (a chain of one) reopens that section
         with whichever h3 group was last expanded still open, rather than
         at its own top level. Passing no active item collapses them all. */
      if (list) setOpenSibling(list, null);
    }

    if (sourceToc) makeCollapsible(sourceToc);

    /* Flat, document-order list of every TOC link at every heading level --
       what #prev-section / #next-section below step through. querySelectorAll
       walks the tree in document order regardless of nesting, so this is
       already h2/h3/h4 interleaved correctly without any manual sorting. */
    var tocLinks = sourceToc
      ? Array.prototype.slice.call(sourceToc.querySelectorAll(".toc__menu a[href]"))
      : [];
    var activeIndex = -1;

    function updateSectionButtons() {
      if (!prevBtn || !nextBtn) return;
      prevBtn.disabled = activeIndex <= 0;
      nextBtn.disabled = activeIndex !== -1 && activeIndex >= tocLinks.length - 1;
    }

    /* $large -- below this, sourceToc is not the sticky sidebar but an
       inline block sitting in normal document flow near the top of the
       article. Its own height participates in page layout there, so
       collapsing/expanding it while the reader is scrolled well past it
       shifts every line below by the height delta: a visible jump that
       fights the reader's own momentum scroll, worst exactly when a
       heading crosses the activation threshold. The sticky sidebar is a
       separate column at $large and up, so its height changes don't move
       the article -- auto-expand is safe there and left as is. */
    var isSidebarLayout = window.matchMedia("(min-width: 64em)");

    /* Registered before scripts.html loads main.min.js further down the
       page, so this is in place before the theme's own Gumshoe init runs
       its first, synchronous detect() -- the event this listens for is not
       missed on initial load.

       The theme's own smoothScroll plugin animates every `a[href*="#"]`
       click over up to ~500ms (durationMax), and Gumshoe re-runs detect() on
       every intermediate scroll frame of that animation -- so a single TOC
       jump activates every heading it passes on the way, each one
       synchronously opening and closing its collapsible group as the
       animation flies past it. Debouncing expandActiveSection (not the
       activeIndex/button update above, which is cheap and fine to track
       live) means only the *final*, settled heading actually restructures
       the DOM -- 180ms of quiet after the last activation is comfortably
       past any real jump. Below $large the call is skipped entirely; see
       isSidebarLayout above. A reader can still open any section by hand --
       only the automatic follow-the-scroll behaviour is disabled. */
    var expandTimer = null;
    if (sourceToc) {
      document.addEventListener("gumshoeActivate", function (e) {
        var link = e.detail && e.detail.link;
        activeIndex = tocLinks.indexOf(link);
        updateSectionButtons();

        if (!isSidebarLayout.matches) return;

        window.clearTimeout(expandTimer);
        expandTimer = window.setTimeout(function () {
          expandActiveSection(sourceToc, link);
        }, 180);
      });
    }

    /* --- prev / next section: step through the same flat link list,
       reusing whichever link the reader would have clicked in the TOC
       itself, so the jump goes through the theme's own smoothScroll plugin
       and the debounce above exactly as a TOC click would. */
    function goToSection(index) {
      if (index < 0 || index >= tocLinks.length) return;
      tocLinks[index].click();
    }

    if (prevBtn) {
      prevBtn.addEventListener("click", function () {
        if (activeIndex > 0) goToSection(activeIndex - 1);
      });
    }
    if (nextBtn) {
      nextBtn.addEventListener("click", function () {
        if (activeIndex === -1) goToSection(0);
        else if (activeIndex < tocLinks.length - 1) goToSection(activeIndex + 1);
      });
    }

    updateSectionButtons();

    /* --- build the panel from a clone; the page's own TOC is never touched --- */

    if (!sourceToc) {
      // home and about have no TOC; hide that button and keep back-to-top
      nav.classList.add("no-toc");
    } else {
      /* A <nav> that does NOT carry the `toc` class, wrapping a div that
         does. Both halves are load-bearing:

         - It must be a <nav>. `_base.scss` scopes the list reset to `nav`
           — `li { list-style: none }`, `a { text-decoration: none }`,
           `ul { margin: 0; padding: 0 }`. Any other element and the menu
           comes back with bullets, underlines and a browser's default
           indent.
         - The <nav> must not match `nav.toc a`. The theme drives its
           scrollspy with `new Gumshoe("nav.toc a")`, and Gumshoe resolves
           duplicate links to the *last* match in document order, so a
           cloned <nav class="toc"> steals the highlight from the real TOC
           and keeps it even at desktop width, where the panel is
           `display: none` and the sticky sidebar is the only one on screen.

         Holding `toc` on the inner div satisfies both, since the theme's
         `.toc` rules never mention the element they sit on. */
      drawer = document.createElement("nav");
      drawer.id = "toc-drawer";
      drawer.setAttribute("aria-label", "Table of contents");

      var tocBox = document.createElement("div");
      tocBox.className = sourceToc.className;
      tocBox.innerHTML = sourceToc.innerHTML;
      drawer.appendChild(tocBox);

      panel = document.createElement("div");
      panel.id = "toc-panel";
      panel.appendChild(drawer);
      body.appendChild(panel);

      tocBtn.setAttribute("aria-controls", "toc-drawer");

      var header = drawer.querySelector("header");
      if (header) {
        var closeBtn = document.createElement("button");
        closeBtn.id = "toc-close";
        closeBtn.type = "button";
        closeBtn.setAttribute("aria-label", "Close table of contents");
        closeBtn.innerHTML =
          '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">' +
          '<path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="currentColor" ' +
          'stroke-width="2.2" stroke-linecap="round" /></svg>';
        closeBtn.addEventListener("click", function () {
          closeDrawer(true);
        });
        header.appendChild(closeBtn);
      }

      // jumping to a heading should dismiss the panel
      drawer.addEventListener("click", function (e) {
        if (e.target.closest("a")) closeDrawer(false);
      });
    }

    /* --- show / hide the buttons on scroll --- */

    var shown = false;
    var ticking = false;

    /* Hysteresis, not a single threshold: a bare `y > innerHeight` flips
       back and forth (each flip replaying the 0.2s show/hide transition)
       whenever the scroll position sits near that line -- iOS rubber-band
       overshoot, or `innerHeight` itself changing as the address bar
       collapses. Shown state needs to climb past a full viewport height to
       appear, but only has to drop back below 80% of one to disappear,
       leaving a dead zone in between where neither edge re-triggers it. */
    function update() {
      ticking = false;
      var y = window.pageYOffset;
      var threshold = window.innerHeight * (shown ? 0.8 : 1);
      var should = y > threshold;
      if (should !== shown) {
        shown = should;
        nav.classList.toggle("is-visible", shown);
      }
    }

    window.addEventListener("scroll", function () {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(update);
      }
    }, { passive: true });

    /* --- open / close --- */

    var closeTimer = null;

    function isOpen() {
      return !!panel && panel.classList.contains("is-open");
    }

    // focusing inside a fixed panel will scroll the document unless asked not
    // to, which is exactly the lurch this whole approach exists to avoid
    function focusQuietly(el) {
      try {
        el.focus({ preventScroll: true });
      } catch (e) {
        el.focus();
      }
    }

    /* Copy the scrollspy's current highlight from the real TOC onto the
       clone. Doing it once per open is enough: the backdrop blocks scrolling
       while the panel is up, so the reader cannot leave the section. */
    function syncActive() {
      if (!drawer || !sourceToc) return;

      var stale = drawer.querySelectorAll(".active");
      for (var i = 0; i < stale.length; i++) stale[i].classList.remove("active");

      var current = sourceToc.querySelector("li.active > a, li.active a");
      if (!current) return;

      var href = current.getAttribute("href");
      var links = drawer.querySelectorAll("a[href]");
      for (var j = 0; j < links.length; j++) {
        if (links[j].getAttribute("href") !== href) continue;
        var li = links[j].closest("li");
        if (li) li.classList.add("active");
        expandActiveSection(drawer, links[j]);
        return;
      }
    }

    function openDrawer() {
      if (!panel || isOpen()) return;
      window.clearTimeout(closeTimer);
      syncActive();

      backdrop.hidden = false;
      // force a reflow so the fade has a starting point to run from
      void backdrop.offsetHeight;

      panel.classList.add("is-open");
      backdrop.classList.add("is-open");

      tocBtn.setAttribute("aria-expanded", "true");
      drawer.setAttribute("tabindex", "-1");
      focusQuietly(drawer);
    }

    function closeDrawer(returnFocus) {
      if (!panel || !isOpen()) return;

      panel.classList.remove("is-open");
      backdrop.classList.remove("is-open");
      tocBtn.setAttribute("aria-expanded", "false");
      drawer.removeAttribute("tabindex");

      window.clearTimeout(closeTimer);
      closeTimer = window.setTimeout(function () {
        backdrop.hidden = true;
      }, reduceMotion() ? 0 : 250);

      if (returnFocus) focusQuietly(tocBtn);
    }

    tocBtn.addEventListener("click", function () {
      if (isOpen()) closeDrawer(true);
      else openDrawer();
    });

    backdrop.addEventListener("click", function () {
      closeDrawer(true);
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" || e.key === "Esc") closeDrawer(true);
    });

    // the panel only exists below $large; don't let it linger past a rotate
    window.addEventListener("resize", function () {
      if (isOpen() && window.innerWidth >= 1024) closeDrawer(false);
    });

    /* --- back to top --- */

    topBtn.addEventListener("click", function () {
      closeDrawer(false);
      window.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" });
    });

    update();
  })();
</script>

<!-- Mount/unmount the players for _includes/yt-embed.html.

     The include deliberately ships no <iframe> at all; see the long comment
     at the top of it for why (49 of them, even collapsed and never loaded,
     killed the web process on iOS). Opening a box builds a local poster --
     no iframe, no network -- and only a click on that poster builds a real
     player, which is torn down again on close. So the document holds zero
     iframes at rest and at most one while a reader is watching, and now a
     player exists only for a video someone actually chose to watch.

     Opening used to mount the player directly, and the reader watched
     YouTube's own document paint: white, then the black stage, then the
     video. Nothing on this side can prevent that -- it is a cross-origin
     document, unstylable, with no event that fires when it has painted.
     The poster is the fix: there is no player there to flash.

     Delegated from the document with `capture: true`, which is load-bearing:
     `toggle` is a non-bubbling event, so a plain document-level listener
     never fires and the whole feature silently does nothing. Capture is what
     lets a single listener serve all 49 boxes without binding to each. -->

<script>
  (function () {
    var PLAYER_ALLOW =
      "accelerometer; autoplay; clipboard-write; encrypted-media; " +
      "gyroscope; picture-in-picture; web-share";

    document.addEventListener("toggle", function (e) {
      var details = e.target;
      if (!details.classList || !details.classList.contains("yt-embed")) return;

      var frame = details.querySelector(".yt-embed__frame");
      if (!frame) return;

      if (!details.open) {
        /* Teardown is the point of the exercise, not tidiness: leaving the
           players mounted lets a reader who works down the page rebuild the
           exact pile of iframes this whole approach exists to avoid. It also
           stops the audio, which a reader closing the box plainly wants.
           The poster goes with it, so a re-opened box starts from the
           poster again rather than from a half-dismissed one. Removing
           exactly the two injected elements, rather than emptying the
           frame, is what leaves the include's own fallback <a> in place
           with its original href. */
        var mounted = frame.querySelectorAll("iframe, .yt-embed__poster");
        for (var j = 0; j < mounted.length; j++) mounted[j].remove();
        frame.classList.remove("is-loaded");
        return;
      }

      if (frame.querySelector(".yt-embed__poster")) return; // already built

      var id = details.getAttribute("data-yt-id");
      if (!id) return; // no ID parsed -- leave the fallback link in place

      var title = details.getAttribute("data-yt-title") || "YouTube video";

      var poster = document.createElement("button");
      poster.type = "button";
      poster.className = "yt-embed__poster";
      poster.setAttribute("aria-label", "Play: " + title);
      poster.appendChild(document.createTextNode(title));

      poster.addEventListener("click", function () {
        if (frame.querySelector("iframe")) return;

        /* One player at a time, enforced -- and enforced HERE, on play,
           rather than in the toggle handler where it used to sit. That is
           not a relaxation: opening a box now costs a poster, which is
           local DOM with no nested browsing context, so the invariant that
           mattered (at most one iframe, zero at rest) is unchanged and in
           fact tighter than before, since a box that is merely opened no
           longer loads anything. Closing the others sets .open, which
           re-enters the toggle handler and takes the teardown branch. */
        var open = document.querySelectorAll("details.yt-embed[open]");
        for (var i = 0; i < open.length; i++) {
          if (open[i] !== details) open[i].open = false;
        }

        /* autoplay=1 is safe only because this runs inside a real click:
           the activation is what lets the delegated permission take. The
           same mount from the toggle handler would be blocked, and the
           reader would face a paused player they have to click again. */
        var iframe = document.createElement("iframe");
        iframe.src = "https://www.youtube-nocookie.com/embed/" +
          encodeURIComponent(id) + "?autoplay=1";
        iframe.title = title;
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.allow = PLAYER_ALLOW;
        iframe.allowFullscreen = true;
        iframe.setAttribute("frameborder", "0");

        /* Underneath the poster, which then fades rather than being torn
           away, so the player's white-then-black load happens behind an
           opaque panel. */
        frame.insertBefore(iframe, poster);
        poster.classList.add("is-dismissed");
      });

      frame.appendChild(poster);
      frame.classList.add("is-loaded");
    }, true);
  })();
</script>
