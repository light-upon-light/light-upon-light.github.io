<!-- Back-to-top button. On narrow viewports the theme's sticky TOC sidebar
     collapses to an inline block at the top of the article, so the only way
     back to the contents is scrolling. Hidden at $large (1024px) and up,
     where the sticky sidebar is visible alongside the text. -->
<button id="back-to-top" type="button" aria-label="Back to top" title="Back to top">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
    <path d="M12 5.5 L5 12.5 M12 5.5 L19 12.5 M12 5.5 L12 19"
          fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</button>

<style>
  #back-to-top {
    position: fixed;
    right: 1rem;
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    z-index: 100;

    /* 44px: minimum comfortable touch target */
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;

    /* dirt skin: $primary-color #343434 on $border-color #e9dcbe */
    color: #f3f3f3;
    background-color: #343434;
    border: 1px solid #e9dcbe;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    cursor: pointer;

    /* hidden until scrolled; visibility (not just opacity) keeps it out of
       the tab order and the accessibility tree while it is off */
    opacity: 0;
    visibility: hidden;
    transform: translateY(0.5rem);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  }

  #back-to-top.is-visible {
    opacity: 0.9;
    visibility: visible;
    transform: translateY(0);
  }

  #back-to-top:hover,
  #back-to-top:focus {
    opacity: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    #back-to-top { transition: none; }
  }

  /* $large — the sticky TOC sidebar is on screen from here up */
  @media (min-width: 64em) {
    #back-to-top { display: none; }
  }

  @media print {
    #back-to-top { display: none; }
  }
</style>

<script>
  (function () {
    var btn = document.getElementById("back-to-top");
    if (!btn) return;

    var shown = false;
    var ticking = false;

    function update() {
      ticking = false;
      var should = window.pageYOffset > window.innerHeight;
      if (should !== shown) {
        shown = should;
        btn.classList.toggle("is-visible", shown);
      }
    }

    window.addEventListener("scroll", function () {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(update);
      }
    }, { passive: true });

    btn.addEventListener("click", function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    });

    update();
  })();
</script>
